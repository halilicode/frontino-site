R("React useRef","useRef","useRef holds a mutable value that survives re-renders without causing one. It is also the way to reach a DOM element.","useRef مقداری تغییرپذیر نگه می‌دارد که بین رندرها می‌ماند ولی رندر مجدد نمی‌سازد. راه دستیابی به المان DOM هم همین است.",'function App() {\n  const input = React.useRef(null);\n  const clicks = React.useRef(0);\n  return <div><input ref={input} placeholder="Focus me" /><button onClick={() => { clicks.current++; input.current.focus(); input.current.value = "Clicks: " + clicks.current; }}>Focus + count</button></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React useReducer","useReducer","useReducer manages complex state with a reducer function: you dispatch actions and the reducer returns the next state.","useReducer با یک تابع reducer وضعیت پیچیده را مدیریت می‌کند: تو action می‌فرستی و reducer وضعیت بعدی را برمی‌گرداند.",'function reducer(s, a) {\n  switch (a.type) {\n    case "inc": return { n: s.n + 1 };\n    case "dec": return { n: s.n - 1 };\n    default: return s;\n  }\n}\nfunction App() {\n  const [s, dispatch] = React.useReducer(reducer, { n: 0 });\n  return <div><button onClick={() => dispatch({ type: "dec" })}>-</button> {s.n} <button onClick={() => dispatch({ type: "inc" })}>+</button></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React useCallback","useCallback","useCallback keeps the same function between renders unless its dependencies change. It helps when you pass callbacks to memoized children.","useCallback تا وقتی وابستگی‌ها عوض نشده باشند یک تابع را بین رندرها ثابت نگه می‌دارد. وقتی کال‌بک به فرزند memo شده می‌دهیم کمک می‌کند.",'const Child = React.memo(({ onClick }) => { console.log("Child rendered"); return <button onClick={onClick}>Child button</button>; });\nfunction App() {\n  const [n, setN] = React.useState(0);\n  const hit = React.useCallback(() => alert("Clicked"), []);\n  return <div><button onClick={() => setN(n + 1)}>Parent renders: {n}</button><Child onClick={hit} /></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React useMemo","useMemo","useMemo caches the result of an expensive calculation and recomputes it only when its dependencies change.","useMemo نتیجهٔ یک محاسبهٔ سنگین را ذخیره می‌کند و فقط وقتی وابستگی‌ها عوض شوند دوباره حساب می‌کند.",'function App() {\n  const [n, setN] = React.useState(10);\n  const [dark, setDark] = React.useState(false);\n  const total = React.useMemo(() => { let s = 0; for (let i = 0; i < n * 100000; i++) s += i; return s; }, [n]);\n  return <div style={{ background: dark ? "#ddd" : "#fff", padding: 10 }}><input type="number" value={n} onChange={e => setN(+e.target.value)} /><button onClick={() => setDark(!dark)}>Toggle bg</button><p>Sum: {total}</p></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Custom Hooks","هوک‌های سفارشی","A custom hook is a function starting with use that reuses stateful logic between components.","هوک سفارشی تابعی با پیشوند use است که منطق دارای state را بین کامپوننت‌ها مشترک می‌کند.",'function useToggle(initial = false) {\n  const [on, setOn] = React.useState(initial);\n  return [on, () => setOn(v => !v)];\n}\nfunction App() {\n  const [light, toggle] = useToggle();\n  return <button onClick={toggle}>{light ? "💡 On" : "🌑 Off"}</button>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Certificate","گواهی ری‌اکت","Finish every React lesson and the quiz, then type your name to preview your Frontino completion certificate.","همهٔ درس‌های ری‌اکت و آزمون را تمام کن، بعد نامت را بنویس تا پیش‌نمایش گواهی پایان دورهٔ فرانتینو را ببینی.",'function App() {\n  const [name, setName] = React.useState("Your Name");\n  return (\n    <div style={{ textAlign: "center" }}>\n      <input value={name} onChange={e => setName(e.target.value)} />\n      <div style={{ margin: 12, padding: 24, border: "6px double #5b3df5", borderRadius: 14 }}>\n        <h2>Certificate of Completion</h2>\n        <p>This certifies that</p>\n        <h1 style={{ color: "#5b3df5" }}>{name}</h1>\n        <p>completed React at Frontino</p>\n      </div>\n    </div>\n  );\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Compiler","کامپایلر ری‌اکت","React Compiler is a build-time tool that adds memoization for you, so you need useMemo and useCallback far less. It is enabled through a Babel or Vite plugin.","کامپایلر ری‌اکت ابزار زمان بیلد است که memoization را برای تو اضافه می‌کند، پس به useMemo و useCallback خیلی کمتر نیاز داری. با پلاگین Babel یا Vite فعال می‌شود.",'function App() {\n  const rules = ["Write plain components", "Do not mutate props or state", "Keep render pure", "Enable the compiler plugin in your build"];\n  return <ul>{rules.map(r => <li key={r}>{r}</li>)}</ul>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Quiz","آزمون ری‌اکت","Test your React knowledge with the three questions below.","با سه سؤال زیر دانش ری‌اکتت را بسنج.",'function App() { return <h2>Quiz time 🎯</h2>; }\nReactDOM.createRoot(root).render(<App />);');
R("React Exercises","تمرین‌های ری‌اکت","Answer the questions below, then try the challenge: add a reset button to the counter.","به سؤال‌های زیر جواب بده، بعد چالش را امتحان کن: یک دکمهٔ ریست به شمارنده اضافه کن.",'function App() {\n  const [n, setN] = React.useState(0);\n  // Challenge: add a Reset button\n  return <button onClick={() => setN(n + 1)}>Count: {n}</button>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Syllabus","سرفصل‌های ری‌اکت","Study order: JSX and components, props and state, events and forms, hooks, styling, routing, and performance.","ترتیب مطالعه: JSX و کامپوننت، پراپس و state، رویداد و فرم، هوک‌ها، استایل، روتینگ و عملکرد.",'function App() {\n  const topics = ["JSX and components", "Props and state", "Events and forms", "Hooks", "Styling", "Routing", "Performance"];\n  return <ol>{topics.map(t => <li key={t}>{t}</li>)}</ol>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Study Plan","برنامهٔ مطالعه ری‌اکت","A 4-week plan: week 1 JSX, components and props; week 2 state, events and forms; week 3 hooks and styling; week 4 a final project such as a to-do app.","برنامهٔ چهارهفته‌ای: هفتهٔ ۱ JSX، کامپوننت و پراپس؛ هفتهٔ ۲ state، رویداد و فرم؛ هفتهٔ ۳ هوک و استایل؛ هفتهٔ ۴ پروژهٔ نهایی مثل اپ لیست کارها.",'function App() {\n  const plan = [["Week 1", "JSX, components, props"], ["Week 2", "State, events, forms"], ["Week 3", "Hooks and styling"], ["Week 4", "Final project"]];\n  return <table border="1" cellPadding="6"><tbody>{plan.map(([w, t]) => <tr key={w}><td>{w}</td><td>{t}</td></tr>)}</tbody></table>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Server","سرور ری‌اکت","React Server Components render on the server and send ready HTML plus a small payload, so less JavaScript reaches the browser. Frameworks like Next.js provide them.","React Server Components روی سرور رندر می‌شوند و HTML آماده با یک بستهٔ کوچک می‌فرستند، پس جاوااسکریپت کمتری به مرورگر می‌رسد. فریم‌ورک‌هایی مثل Next.js آن را می‌دهند.",'function App() {\n  return <pre>{"// Server Component (default in Next.js)\\nasync function Posts() {\\n  const posts = await db.posts.findMany();\\n  return <ul>{posts.map(p => <li key={p.id}>{p.title}</li>)}</ul>;\\n}\\n\\n// Client Component\\n\\"use client\\";"}</pre>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Interview Prep","آمادگی مصاحبه ری‌اکت","Common questions: virtual DOM, props vs state, why keys matter, useEffect dependencies, controlled vs uncontrolled inputs, and how to avoid extra re-renders.","سؤال‌های رایج: دام مجازی، تفاوت پراپس و state، اهمیت key، وابستگی‌های useEffect، ورودی کنترل‌شده در برابر کنترل‌نشده و نحوهٔ جلوگیری از رندرهای اضافه.",'function App() {\n  const qa = [["Props vs state?", "Props come from the parent and are read-only; state is owned by the component."], ["Why keys?", "They let React match list items between renders."], ["Controlled input?", "Its value lives in React state."]];\n  return <div>{qa.map(([q, a]) => <details key={q}><summary>{q}</summary><p>{a}</p></details>)}</div>;\n}\nReactDOM.createRoot(root).render(<App />);');
const C=(k,ft,en,fa,c)=>{A("css",k,[en],c,[fa]);FAT[k]=ft};
C("CSS HOME","خانهٔ CSS","Welcome! CSS makes web pages beautiful. Edit any example, press Run and see the change instantly.","خوش آمدی! CSS صفحه‌های وب را زیبا می‌کند. هر مثال را عوض کن، Run بزن و تغییر را همان لحظه ببین.",'<style>h1{color:#5b3df5;font-family:sans-serif}</style>\n<h1>Hello CSS!</h1>');
C("CSS Syntax","نحو CSS","A rule is selector { property: value; }. The selector picks elements, and each declaration sets one property.","هر قانون به شکل selector { property: value; } است. انتخابگر المان را می‌گیرد و هر تعریف یک ویژگی را می‌سازد.",'<style>\np { color: teal; font-size: 20px; text-align: center; }\n</style>\n<p>Selector, property, value.</p>');
C("CSS How To","نحوهٔ استفاده","Three ways: inline style attribute, a style element in head (internal), or an external .css file linked with link rel=stylesheet. External is best for real sites.","سه راه: ویژگی style درون‌خطی، المان style در head (داخلی) یا فایل css خارجی با link rel=stylesheet. برای سایت واقعی خارجی بهتر است.",'<link rel="stylesheet" href="styles.css">\n<style>.internal{color:tomato}</style>\n<p class="internal">Internal</p>\n<p style="color:#5b3df5">Inline</p>');
C("CSS Comments","کامنت‌ها","Comments start with /* and end with */. They explain code or temporarily switch a rule off.","کامنت با /* شروع و با */ تمام می‌شود. برای توضیح کد یا خاموش کردن موقت یک قانون است.",'<style>\n/* Heading color */\nh1 { color: tomato; }\n/* h1 { color: blue; }  <- disabled */\n</style>\n<h1>Comments</h1>');
C("CSS Errors","خطاهای CSS","CSS ignores a declaration it does not understand and moves on, so a typo silently does nothing. Check DevTools for crossed-out properties.","CSS تعریفی که نمی‌فهمد را نادیده می‌گیرد، پس غلط املایی بی‌صدا اثر ندارد. در DevTools ویژگی‌های خط‌خورده را ببین.",'<style>\np { colour: red; }       /* typo: ignored */\np { color: green; }      /* works */\n</style>\n<p>Which color do I get?</p>');
C("CSS Backgrounds","پس‌زمینه‌ها","background-color, background-image, background-repeat, background-position and background-size control the background. The background shorthand combines them.","background-color، background-image، background-repeat، background-position و background-size پس‌زمینه را کنترل می‌کنند. مخفف background همه را ترکیب می‌کند.",'<style>\n.b{height:120px;background:linear-gradient(135deg,#5b3df5,#0fa97f);color:#fff;display:grid;place-items:center}\n.p{height:80px;background:radial-gradient(circle,#ffb020 20%,transparent 21%) 0 0/24px 24px #fff7e6}\n</style>\n<div class="b">Gradient</div><div class="p"></div>');
C("CSS Borders","گردی و حاشیه (Border)","border sets width, style and color. Styles include solid, dashed, dotted and double. You can style each side separately.","border ضخامت، سبک و رنگ را تعیین می‌کند. سبک‌ها: solid، dashed، dotted و double. هر ضلع را جدا هم می‌شود استایل کرد.",'<style>\n.a{border:3px solid #5b3df5;padding:8px;margin:6px}\n.b{border:3px dashed tomato;padding:8px;margin:6px}\n.c{border-bottom:4px double teal;padding:8px;margin:6px}\n</style>\n<p class="a">solid</p><p class="b">dashed</p><p class="c">bottom double</p>');
C("CSS Margins","حاشیه‌های بیرونی (Margin)","margin is the space outside an element. Use one value for all sides or four values (top right bottom left). margin: 0 auto centers a block with a width.","margin فاصلهٔ بیرونی المان است. یک مقدار برای همه طرف‌ها یا چهار مقدار (بالا راست پایین چپ). margin: 0 auto بلوک دارای عرض را وسط‌چین می‌کند.",'<style>\n.box{width:200px;margin:20px auto;padding:10px;background:#5b3df5;color:#fff;text-align:center}\n</style>\n<div class="box">margin: 20px auto</div>');
C("CSS Padding","فاصلهٔ داخلی (Padding)","padding is the space between content and border. It grows the element unless box-sizing: border-box is set.","padding فاصلهٔ بین محتوا و border است. مگر اینکه box-sizing: border-box باشد، اندازهٔ المان را بزرگ‌تر می‌کند.",'<style>\n.p{background:#e6fffa;border:2px solid teal;padding:30px 10px 10px 50px}\n</style>\n<div class="p">padding: 30px 10px 10px 50px</div>');
C("CSS Height / Width","ارتفاع و عرض","width and height set the content size; min- and max- versions set limits. Use percentages for flexible sizes.","width و height اندازهٔ محتوا را تعیین می‌کنند؛ نسخه‌های min- و max- محدودیت می‌گذارند. برای اندازه‌های انعطاف‌پذیر از درصد استفاده کن.",'<style>\n.a{width:50%;height:60px;background:#5b3df5}\n.b{width:100%;max-width:300px;min-height:40px;background:tomato}\n</style>\n<div class="a"></div><div class="b"></div>');
C("CSS Outline","اوت‌لاین","outline is drawn outside the border and takes no space. outline-offset moves it away. Never remove focus outlines without a replacement.","outline بیرون border کشیده می‌شود و جا نمی‌گیرد. outline-offset آن را دور می‌کند. اوت‌لاین فوکوس را بدون جایگزین حذف نکن.",'<style>\nbutton{padding:10px 18px;border:2px solid #333}\nbutton:focus-visible{outline:3px solid #5b3df5;outline-offset:4px}\n</style>\n<button>Press Tab to focus me</button>');
C("CSS Text","متن","Text properties: color, text-align, text-decoration, text-transform, letter-spacing, line-height and text-indent.","ویژگی‌های متن: color، text-align، text-decoration، text-transform، letter-spacing، line-height و text-indent.",'<style>\nh2{text-align:center;text-transform:uppercase;letter-spacing:4px;text-decoration:underline wavy tomato}\np{line-height:1.8;text-indent:30px}\n</style>\n<h2>Styled text</h2><p>Good line height makes paragraphs much easier to read on screens.</p>');
C("CSS Fonts","فونت‌ها","font-family needs a fallback list, e.g. Georgia, serif. Also set font-size, font-weight and font-style, or use the font shorthand.","font-family باید لیست جایگزین داشته باشد، مثل Georgia, serif. همچنین font-size، font-weight و font-style یا مخفف font را تنظیم کن.",'<style>\n.s{font-family:Georgia,serif;font-size:22px}\n.m{font:italic 700 20px/1.4 monospace}\n</style>\n<p class="s">Serif text</p><p class="m">Monospace italic bold</p>');
C("CSS Icons","آیکن‌ها","Icons can be Unicode symbols, inline SVG or an icon font. Inline SVG with currentColor inherits the text color and stays sharp.","آیکن را می‌توان با نماد یونیکد، SVG درون‌خطی یا فونت آیکن ساخت. SVG با currentColor رنگ متن را می‌گیرد و تیز می‌ماند.",'<style>.i{color:#5b3df5;font-size:28px;display:inline-flex;gap:10px;align-items:center}svg{width:1em;height:1em;fill:currentColor}</style>\n<div class="i"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.600-8 11-8 11z"/></svg> Favorite &#9733; &#10003;</div>');
C("CSS Links","لینک‌ها","Style links by state in order: a:link, a:visited, a:hover, a:active (LoVe HAte). Add :focus-visible for keyboard users.","لینک را با حالت و به ترتیب استایل کن: a:link، a:visited، a:hover، a:active. برای کاربران کیبورد :focus-visible هم بیاور.",'<style>\na{color:#5b3df5;text-decoration:none;border-bottom:2px solid transparent;transition:.2s}\na:hover{border-color:tomato;color:tomato}\n</style>\n<a href="#">Hover this link</a>');
C("CSS Lists","لیست‌ها","list-style-type changes the marker, list-style-position places it, and list-style: none removes it for menus.","list-style-type نشانه را عوض می‌کند، list-style-position جایش را تعیین می‌کند و list-style: none آن را برای منوها حذف می‌کند.",'<style>\n.a{list-style-type:square}\n.b{list-style:none;padding:0}\n.b li::before{content:"✔ ";color:#0fa97f}\n</style>\n<ul class="a"><li>Square</li><li>Marker</li></ul>\n<ul class="b"><li>Custom</li><li>Check list</li></ul>');
C("CSS Tables","جدول‌ها","Use border-collapse: collapse for single borders, padding for breathing room, and :nth-child(even) for zebra stripes.","برای حاشیهٔ تک از border-collapse: collapse، برای فضا از padding و برای راه‌راه کردن سطرها از :nth-child(even) استفاده کن.",'<style>\ntable{border-collapse:collapse;width:100%}\nth,td{padding:10px;border:1px solid #ccd}\nth{background:#5b3df5;color:#fff}\ntr:nth-child(even) td{background:#f1f0ff}\n</style>\n<table><tr><th>Name</th><th>Score</th></tr><tr><td>Sara</td><td>90</td></tr><tr><td>Ali</td><td>85</td></tr><tr><td>Mina</td><td>92</td></tr></table>');
C("CSS Display","نمایش (Display)","display decides how an element behaves: block, inline, inline-block, flex, grid or none (removes it from the page). visibility: hidden hides but keeps the space.","display رفتار المان را تعیین می‌کند: block، inline، inline-block، flex، grid یا none (از صفحه حذف می‌شود). visibility: hidden مخفی می‌کند ولی جا را نگه می‌دارد.",'<style>\nspan{background:#dfd;padding:4px}\n.blk{display:block}\n.gone{display:none}\n</style>\n<span>inline</span><span class="blk">now block</span><span class="gone">hidden</span><span>visible</span>');
C("CSS Max-width","حداکثر عرض","max-width stops an element growing past a limit while still shrinking on small screens, unlike a fixed width.","max-width مانع از بزرگ‌تر شدن از یک حد می‌شود ولی برخلاف width ثابت، در صفحه‌های کوچک کوچک هم می‌شود.",'<style>\n.c{max-width:360px;margin:auto;background:#eef;padding:16px}\n</style>\n<div class="c">Resize the result panel: this box never exceeds 360px but can shrink.</div>');
C("CSS Position Offsets","جابه‌جایی موقعیت","top, right, bottom, left (or logical inset-*) move positioned elements. They have no effect on position: static.","top، right، bottom و left (یا inset-* منطقی) المان‌های موقعیت‌دار را جابه‌جا می‌کنند و روی position: static اثری ندارند.",'<style>\n.w{position:relative;height:120px;background:#eef}\n.d{position:absolute;width:30px;height:30px;background:#5b3df5}\n.tl{top:0;left:0}.br{bottom:0;right:0;background:tomato}.c{top:50%;left:50%;transform:translate(-50%,-50%);background:teal}\n</style>\n<div class="w"><i class="d tl"></i><i class="d br"></i><i class="d c"></i></div>');
C("CSS Z-index","ایندکس لایه (z-index)","z-index sets stacking order for positioned elements: the higher number sits on top. It only works with a position other than static.","z-index ترتیب رویه‌هم‌قرارگیری را تعیین می‌کند: عدد بزرگ‌تر بالاتر است. فقط با position غیر از static کار می‌کند.",'<style>\n.s{position:absolute;width:90px;height:90px;color:#fff;padding:6px}\n.a{background:#5b3df5;left:10px;top:10px;z-index:2}\n.b{background:tomato;left:50px;top:40px;z-index:1}\n</style>\n<div style="position:relative;height:150px"><div class="s a">z=2</div><div class="s b">z=1</div></div>');
C("CSS Overflow","سرریز (Overflow)","overflow controls content larger than its box: visible, hidden, scroll or auto. text-overflow: ellipsis adds an ellipsis to one-line text.","overflow محتوای بزرگ‌تر از جعبه را کنترل می‌کند: visible، hidden، scroll یا auto. text-overflow: ellipsis برای متن یک‌خطی سه‌نقطه می‌گذارد.",'<style>\n.a{height:60px;overflow:auto;border:1px solid #999}\n.e{width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid #999}\n</style>\n<div class="a">Line 1<br>Line 2<br>Line 3<br>Line 4<br>Line 5</div>\n<div class="e">This long sentence is cut with an ellipsis</div>');
C("CSS Float","شناورسازی (Float)","float pushes an element left or right so text wraps around it. Use clear to stop wrapping and prefer Flexbox for layouts.","float المان را به چپ یا راست می‌برد تا متن دورش پیچد. با clear دورپیچ را متوقف کن و برای چیدمان از فلکس‌باکس استفاده کن.",'<style>\n.f{float:left;width:70px;height:70px;background:#5b3df5;margin:0 10px 4px 0}\n</style>\n<div class="f"></div><p>Text wraps around a floated box. Text wraps around a floated box. Text wraps around a floated box. Text wraps around a floated box.</p>');
C("CSS Inline-block","اینلاین‌بلاک","inline-block sits in a line like text but accepts width, height and vertical margins like a block.","inline-block مثل متن در یک خط می‌نشیند ولی مثل بلوک width، height و حاشیهٔ عمودی می‌پذیرد.",'<style>\n.i{display:inline-block;width:80px;height:50px;margin:6px;background:#0fa97f;color:#fff;text-align:center;line-height:50px}\n</style>\n<span class="i">One</span><span class="i">Two</span><span class="i">Three</span>');
C("CSS Align","هم‌ترازی (Align)","Center text with text-align, a block with margin: auto, and anything with Flexbox or Grid: place-items: center is the shortest way.","متن را با text-align، بلوک را با margin: auto و هر چیز را با فلکس یا گرید وسط‌چین کن؛ place-items: center کوتاه‌ترین راه است.",'<style>\n.c{display:grid;place-items:center;height:140px;background:#eef}\n.c div{background:#5b3df5;color:#fff;padding:12px 20px}\n</style>\n<div class="c"><div>Perfectly centered</div></div>');
C("CSS Combinators","ترکیب‌کننده‌ها","Combinators relate selectors: descendant (space), child (>), adjacent sibling (+) and general sibling (~).","ترکیب‌کننده‌ها انتخابگرها را به هم مرتبط می‌کنند: نسل (فاصله)، فرزند (>)، هم‌روند مجاور (+) و هم‌روند کلی (~).",'<style>\ndiv p{color:#5b3df5}\ndiv > span{color:tomato}\nh3 + p{font-weight:bold}\nh3 ~ em{color:teal}\n</style>\n<div><p>descendant p</p><span>child span</span></div>\n<h3>Title</h3><p>adjacent bold p</p><em>general sibling</em>');
C("CSS Pseudo-classes","شبه‌کلاس‌ها","A pseudo-class styles a state or position: :hover, :focus, :checked, :first-child, :nth-child(), :not() and :disabled.","شبه‌کلاس یک حالت یا جایگاه را استایل می‌کند: :hover، :focus، :checked، :first-child، :nth-child()، :not() و :disabled.",'<style>\nli:first-child{font-weight:bold}\nli:nth-child(odd){color:#5b3df5}\nli:hover{background:#ffe9d6}\ninput:checked + span{color:teal}\n</style>\n<ul><li>One</li><li>Two</li><li>Three</li></ul>\n<label><input type="checkbox"><span>Check me</span></label>');
C("CSS Pseudo-elements","شبه‌المان‌ها","Pseudo-elements style a part of an element: ::before and ::after (with content), ::first-line, ::first-letter, ::selection and ::placeholder.","شبه‌المان بخشی از المان را استایل می‌کند: ::before و ::after (با content)، ::first-line، ::first-letter، ::selection و ::placeholder.",'<style>\np::first-letter{font-size:40px;color:tomato;float:left;line-height:1}\n.q::before{content:"“";color:#5b3df5}.q::after{content:"”";color:#5b3df5}\n::selection{background:#ffd54a}\n</style>\n<p>Drop caps with first-letter. Select this text to see the highlight.</p>\n<p class="q">Quoted with pseudo-elements</p>');
C("CSS Opacity","شفافیت (Opacity)","opacity from 0 to 1 fades the whole element, including its children. For a see-through background only, use rgba() or hsl() with alpha.","opacity از ۰ تا ۱ کل المان منجمله فرزندان را کمرنگ می‌کند. برای فقط پس‌زمینهٔ شفاف از rgba() یا hsl() با آلفا استفاده کن.",'<style>\n.a{background:#5b3df5;color:#fff;padding:10px;opacity:.5}\n.b{background:rgba(91,61,245,.4);color:#000;padding:10px;margin-top:6px}\n</style>\n<div class="a">opacity .5 (text too)</div><div class="b">rgba background only</div>');
C("CSS Navigation Bars","نوار ناوبری","A nav bar is a list of links: remove list markers, then lay items out with Flexbox and style the hover state.","نوار ناوبری لیستی از لینک‌هاست: نشانه‌ها را حذف کن، با فلکس چیده و حالت hover را استایل کن.",'<style>\nnav ul{list-style:none;margin:0;padding:0;display:flex;background:#14173d}\nnav a{display:block;padding:12px 18px;color:#fff;text-decoration:none;transition:.2s}\nnav a:hover{background:#5b3df5}\n</style>\n<nav><ul><li><a href="#">Home</a></li><li><a href="#">News</a></li><li><a href="#">Contact</a></li></ul></nav>');
C("CSS Dropdowns","منوهای کشویی","A CSS-only dropdown hides a menu with display:none and shows it on :hover (and :focus-within for keyboards) of its parent.","منوی کشویی با فقط CSS منو را با display:none پنهان می‌کند و با :hover (و برای کیبورد :focus-within) والدش نشان می‌دهد.",'<style>\n.dd{position:relative;display:inline-block}\n.dd button{padding:10px 16px}\n.m{display:none;position:absolute;background:#fff;border:1px solid #ccd;min-width:140px;z-index:5}\n.m a{display:block;padding:8px 12px;color:#14173d;text-decoration:none}.m a:hover{background:#eef}\n.dd:hover .m,.dd:focus-within .m{display:block}\n</style>\n<div class="dd"><button>Menu ▾</button><div class="m"><a href="#">Link 1</a><a href="#">Link 2</a></div></div>');
C("CSS Image Gallery","گالری تصاویر","A responsive gallery is a Grid with repeat(auto-fill, minmax(120px, 1fr)): columns appear and disappear as the width changes.","گالری واکنش‌گرا یک گرید با repeat(auto-fill, minmax(120px, 1fr)) است: با تغییر عرض، ستون‌ها کم و زیاد می‌شوند.",'<style>\n.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}\n.g div{aspect-ratio:1;border-radius:10px;transition:transform .25s}\n.g div:hover{transform:scale(1.06)}\n</style>\n<div class="g"><div style="background:#5b3df5"></div><div style="background:#0fa97f"></div><div style="background:tomato"></div><div style="background:#ffb020"></div><div style="background:#2d9cf0"></div><div style="background:#a24bd6"></div></div>');
C("CSS Image Sprites","اسپرایت تصویر","A sprite is one image holding many icons. Show one part with background-position, saving network requests.","اسپرایت یک تصویر شامل چند آیکن است. با background-position یک بخش را نشان بده تا درخواست‌های شبکه کم شوند.",'<style>\n.s{width:50px;height:50px;display:inline-block;margin:4px;border-radius:8px;background:linear-gradient(90deg,#5b3df5 33.3%,#0fa97f 33.3% 66.6%,tomato 66.6%);background-size:150px 50px}\n.a{background-position:0 0}.b{background-position:-50px 0}.c{background-position:-100px 0}\n</style>\n<span class="s a"></span><span class="s b"></span><span class="s c"></span>');
C("CSS Attribute Selectors","انتخابگر ویژگی","Select by attribute: [target], [type=text], [href^=https] (starts with), [href$=.pdf] (ends with), [class*=btn] (contains).","با ویژگی انتخاب کن: [target]، [type=text]، [href^=https] (شروع)، [href$=.pdf] (پایان)، [class*=btn] (شامل).",'<style>\na[href^="https"]{color:teal}\na[href$=".pdf"]{color:tomato}\ninput[type="text"]{border:2px solid #5b3df5}\n</style>\n<a href="https://example.com">Secure link</a><br><a href="file.pdf">PDF file</a><br><input type="text" placeholder="text input">');
C("CSS Forms","فرم‌ها","Style inputs with padding, border, border-radius and a clear :focus state. Use width:100% with box-sizing: border-box.","ورودی‌ها را با padding، border، border-radius و حالت واضح :focus استایل کن. width:100% را با box-sizing: border-box به کار ببر.",'<style>\ninput,select,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:2px solid #ccd;border-radius:8px;font:inherit}\ninput:focus,textarea:focus{outline:none;border-color:#5b3df5;box-shadow:0 0 0 3px #5b3df533}\nbutton{padding:10px 20px;border:0;border-radius:8px;background:#5b3df5;color:#fff}\n</style>\n<input placeholder="Name"><textarea placeholder="Message"></textarea><button>Send</button>');
C("CSS Counters","شمارنده‌ها","CSS counters number things automatically: counter-reset on the parent, counter-increment on each item, and counter() inside content.","شمارنده‌های CSS خودکار شماره می‌دهند: counter-reset روی والد، counter-increment روی هر آیتم و counter() داخل content.",'<style>\nbody{counter-reset:sec}\nh3::before{counter-increment:sec;content:"Section " counter(sec) ": ";color:#5b3df5}\n</style>\n<h3>Intro</h3><h3>Basics</h3><h3>Advanced</h3>');
C("CSS Units","واحدها","Absolute: px. Relative: em (parent font), rem (root font), % (parent), vw/vh (viewport), ch (character width). Prefer rem for text and % or fr for layout.","مطلق: px. نسبی: em (فونت والد)، rem (فونت ریشه)، % (والد)، vw/vh (صفحه نمایش)، ch (عرض کاراکتر). برای متن rem و برای چیدمان % یا fr بهتر است.",'<style>\n.a{font-size:20px}.b{font-size:1.5rem}.c{width:50%;background:#eef}.d{width:30ch;background:#dfd}\n</style>\n<p class="a">20px</p><p class="b">1.5rem</p><p class="c">50%</p><p class="d">30ch wide</p>');
C("CSS Inheritance","وراثت","Some properties (color, font, line-height) inherit from the parent; others (border, margin, padding) do not. Force it with inherit, initial or unset.","بعضی ویژگی‌ها (color، font، line-height) از والد ارث می‌برند؛ بقیه (border، margin، padding) نه. با inherit، initial یا unset می‌شود اجبارش کرد.",'<style>\n.p{color:#5b3df5;border:2px solid tomato;padding:10px}\n.p span{border:inherit}\n</style>\n<div class="p">Color is inherited<br><span>this span also inherits the border</span></div>');
C("CSS Specificity","اولویت (Specificity)","When rules conflict, the more specific selector wins: inline style, then #id, then .class/[attr]/:pseudo-class, then element. Equal specificity: the last rule wins.","وقتی قانون‌ها تضاد دارند، انتخابگر خاص‌تر برنده می‌شود: استایل درون‌خطی، بعد #id، بعد .class/[attr]/:pseudo-class و بعد المان. در برابری، قانون آخر می‌برد.",'<style>\np{color:gray}\n.x{color:teal}\n#y{color:tomato}\n</style>\n<p class="x" id="y">Id beats class beats element</p>\n<p class="x">Class beats element</p>\n<p>Element only</p>');
C("CSS !important","!important","!important overrides normal specificity. Use it rarely, for utilities or to beat third-party CSS; overusing it makes code hard to maintain.","!important اولویت معمولی را لغو می‌کند. خیلی کم استفاده کن، برای کلاس‌های کمکی یا غلبه بر CSS خارجی؛ استفادهٔ زیاد نگهداری کد را سخت می‌کند.",'<style>\n#a{color:tomato}\np{color:teal !important}\n</style>\n<p id="a">Teal wins because of !important</p>');
C("CSS Math Functions","توابع ریاضی","calc() does math with mixed units, min() and max() pick the smaller or larger value, and clamp(min, preferred, max) gives fluid sizes.","calc() با واحدهای مختلف محاسبه می‌کند، min() و max() کوچک‌تر یا بزرگ‌تر را می‌روند و clamp(min, ترجیحی, max) اندازه‌های روان می‌دهد.",'<style>\n.a{width:calc(100% - 80px);background:#5b3df5;color:#fff;padding:8px}\nh2{font-size:clamp(1.2rem,4vw,2.4rem)}\n.b{width:min(90%,300px);background:tomato;color:#fff;padding:8px;margin-top:6px}\n</style>\n<div class="a">calc(100% - 80px)</div><h2>clamp() fluid heading</h2><div class="b">min(90%, 300px)</div>');
C("CSS Optimization","بهینه‌سازی CSS","Keep CSS fast: minify files, remove unused rules, avoid deep selectors, prefer transform and opacity for animation, and use shorthand properties.","CSS را سریع نگه دار: فایل‌ها را minify کن، قانون‌های بلااستفاده را حذف کن، از انتخابگرهای عمیق پرهیز کن، برای انیمیشن transform و opacity را ترجیح بده و از مخفف‌ها استفاده کن.",'<style>\n/* Slow: layout on every frame   -> left, top, width */\n/* Fast: compositor only         -> transform, opacity */\n.b{width:60px;height:60px;background:#5b3df5;animation:go 1.2s ease-in-out infinite alternate}\n@keyframes go{to{transform:translateX(160px)}}\n</style>\n<div class="b"></div>');
C("CSS Accessibility","دسترس‌پذیری در CSS","Keep sufficient color contrast, never hide focus outlines, do not rely on color alone, respect prefers-reduced-motion and allow text to be resized.","کنتراست رنگ کافی نگه دار، اوت‌لاین فوکوس را پنهان نکن، فقط به رنگ تکیه نکن، به prefers-reduced-motion احترام بگذار و اجازه بده متن بزرگ شود.",'<style>\n.spin{width:50px;height:50px;border-radius:50%;border:6px solid #5b3df5;border-top-color:transparent;animation:s 1s linear infinite}\n@keyframes s{to{transform:rotate(360deg)}}\n@media (prefers-reduced-motion:reduce){.spin{animation:none}}\na:focus-visible{outline:3px solid #5b3df5;outline-offset:3px}\n</style>\n<div class="spin"></div><p><a href="#">Tab to me: visible focus ring</a></p>');
C("CSS Website Layout","چیدمان وب‌سایت","A classic layout: header, nav, a two-column main (content + sidebar) and footer, built with Grid areas.","چیدمان کلاسیک: header، nav، main دوستونه (محتوا + نوار کناری) و footer که با grid areas ساخته می‌شود.",'<style>\n.w{display:grid;gap:8px;grid-template-areas:"h h" "n n" "m s" "f f";grid-template-columns:3fr 1fr}\n.w>*{padding:12px;color:#fff}\n.h{grid-area:h;background:#5b3df5}.n{grid-area:n;background:#14173d}.m{grid-area:m;background:#0fa97f;min-height:80px}.s{grid-area:s;background:tomato}.f{grid-area:f;background:#555}\n</style>\n<div class="w"><header class="h">Header</header><nav class="n">Nav</nav><main class="m">Main</main><aside class="s">Side</aside><footer class="f">Footer</footer></div>');
const PH="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27400%27 height=%27260%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27%3E%3Cstop offset=%270%27 stop-color=%27%235b3df5%27/%3E%3Cstop offset=%271%27 stop-color=%27%230fa97f%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%27400%27 height=%27260%27 fill=%27url(%23g)%27/%3E%3Ccircle cx=%2790%27 cy=%2775%27 r=%2732%27 fill=%27%23ffb020%27/%3E%3Cpath d=%27M0 260 L140 130 L230 210 L300 150 L400 260Z%27 fill=%27%2314173d%27 opacity=%27.55%27/%3E%3C/svg%3E";
C("CSS Rounded Corners","گوشه‌های گرد","border-radius rounds corners: one value for all, up to four for each corner, 50% for a circle, 999px for a pill.","border-radius گوشه‌ها را گرد می‌کند: یک مقدار برای همه، تا چهار مقدار برای هر گوشه، 50% برای دایره و 999px برای قرصی.",'<style>\n.r{display:inline-block;width:80px;height:80px;margin:6px;background:#5b3df5}\n</style>\n<div class="r" style="border-radius:12px"></div><div class="r" style="border-radius:50%"></div><div class="r" style="border-radius:40px 0 40px 0"></div><div class="r" style="width:140px;border-radius:999px"></div>');
C("CSS Border Images","تصویر حاشیه","border-image uses an image or gradient as the border. border-image-slice decides how it is cut.","border-image از تصویر یا گرادیان به‌عنوان حاشیه استفاده می‌کند. border-image-slice نحوهٔ برش آن را مشخص می‌کند.",'<style>\n.b{padding:24px;border:10px solid;border-image:linear-gradient(135deg,#5b3df5,#0fa97f,#ffb020) 1;text-align:center}\n</style>\n<div class="b">Gradient border image</div>');
C("CSS Gradients","گرادیان‌ها","linear-gradient blends colors along a line, radial-gradient from a center point and conic-gradient around a center. Add color stops for control.","linear-gradient رنگ‌ها را روی یک خط، radial-gradient از یک مرکز و conic-gradient دور مرکز می‌آمیزد. برای کنترل نقطه‌های رنگ اضافه کن.",'<style>\n.g{height:70px;margin:6px 0;border-radius:10px}\n</style>\n<div class="g" style="background:linear-gradient(90deg,#5b3df5,#0fa97f)"></div>\n<div class="g" style="background:radial-gradient(circle,#ffb020,#e8451e)"></div>\n<div class="g" style="background:conic-gradient(#5b3df5,#0fa97f,#ffb020,#5b3df5)"></div>');
C("CSS Shadows","سایه‌ها","box-shadow: x y blur spread color adds a shadow to boxes; text-shadow does the same for text. Layer several shadows with commas.","box-shadow: x y blur spread color به جعبه سایه می‌دهد و text-shadow به متن. چند سایه را با ویرگول روی هم بگذار.",'<style>\n.c{width:160px;padding:20px;margin:20px;border-radius:14px;background:#fff;box-shadow:0 10px 25px #5b3df544,0 2px 6px #0002}\nh2{text-shadow:2px 2px 0 #ffb020,4px 4px 0 #5b3df544}\n</style>\n<div class="c">Soft layered shadow</div><h2>Text shadow</h2>');
C("CSS Text Effects","افکت‌های متن","Text effects include text-overflow, word-wrap, writing-mode, gradient text with background-clip: text, and -webkit-text-stroke outlines.","افکت‌های متن شامل text-overflow، word-wrap، writing-mode، متن گرادیانتی با background-clip: text و خط‌کنار با -webkit-text-stroke است.",'<style>\nh1{font:800 44px sans-serif;margin:0;background:linear-gradient(90deg,#5b3df5,#0fa97f,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{font:800 40px sans-serif;margin:0;color:transparent;-webkit-text-stroke:2px #5b3df5}\n</style>\n<h1>Gradient text</h1><h2>Outlined text</h2>');
C("CSS Custom Fonts","فونت‌های سفارشی","@font-face loads your own font file. Use woff2 for size, add font-display: swap, and keep a fallback stack. Google Fonts offers the same with a link tag.","@font-face فایل فونت خودت را بارگذاری می‌کند. برای حجم کم از woff2، با font-display: swap و لیست جایگزین استفاده کن. Google Fonts همین را با تگ link می‌دهد.",'<style>\n/* @font-face { font-family: "Brand"; src: url("brand.woff2") format("woff2"); font-display: swap; } */\n.f{font-family:"Brand",Georgia,serif;font-size:28px}\n</style>\n<p class="f">Falls back to Georgia when Brand is missing.</p>');
C("CSS 2D Transforms","ترنسفرم دوبعدی","transform moves, turns and resizes elements: translate(), rotate(), scale(), skew(). It does not affect the layout of other elements.","transform المان را جابه‌جا، چرخان یا تغییر اندازه می‌دهد: translate()، rotate()، scale() و skew(). روی چیدمان بقیه المان‌ها اثر ندارد.",'<style>\n.t{display:inline-block;width:70px;height:70px;margin:26px;background:#5b3df5;color:#fff;text-align:center;line-height:70px;transition:.3s}\n.t:hover{transform:rotate(15deg) scale(1.2)}\n</style>\n<div class="t" style="transform:rotate(20deg)">rotate</div><div class="t" style="transform:skew(15deg)">skew</div><div class="t">hover</div>');
C("CSS 3D Transforms","ترنسفرم سه‌بعدی","3D transforms add rotateX, rotateY and translateZ. Set perspective on the parent to get depth, and transform-style: preserve-3d for nested 3D.","ترنسفرم سه‌بعدی rotateX، rotateY و translateZ را اضافه می‌کند. برای عمق perspective را روی والد و برای سه‌بعدی تودرتو transform-style: preserve-3d بگذار.",'<style>\n.s{perspective:500px;display:inline-block;margin:30px}\n.c{width:120px;height:120px;background:linear-gradient(135deg,#5b3df5,#0fa97f);color:#fff;display:grid;place-items:center;border-radius:12px;transition:transform .8s}\n.s:hover .c{transform:rotateY(180deg)}\n</style>\n<div class="s"><div class="c">Hover: flip</div></div>');
C("CSS Tooltips","تولتیپ‌ها","A CSS tooltip is a hidden ::after (or child) shown on :hover, positioned absolutely above the target. Use title or aria for accessibility too.","تولتیپ CSS یک ::after (یا فرزند) پنهان است که با :hover بالای هدف نمایش داده می‌شود. برای دسترس‌پذیری title یا aria هم بگذار.",'<style>\n.tip{position:relative;display:inline-block;margin:40px;border-bottom:2px dotted #5b3df5;cursor:help}\n.tip::after{content:attr(data-tip);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:#14173d;color:#fff;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}\n.tip:hover::after{opacity:1}\n</style>\n<span class="tip" data-tip="I am a tooltip">Hover me</span>');
C("CSS Image Styling","استایل تصاویر","Style images with border-radius, borders, shadows and max-width: 100% so they never overflow their container.","تصاویر را با border-radius، حاشیه، سایه و max-width: 100% استایل کن تا هرگز از ظرف بیرون نزنند.",'<style>\nimg{max-width:100%;height:auto;border-radius:14px;border:4px solid #fff;box-shadow:0 8px 24px #0004;display:block}\n</style>\n<img src="'+PH+'" alt="Placeholder" width="260">');
C("CSS Image Modal","مودال تصویر","A CSS-only image modal uses :target: a link points to #big, and the hidden overlay with id=big becomes visible.","مودال تصویر با فقط CSS از :target استفاده می‌کند: لینک به #big می‌رود و لایهٔ پنهان با id=big دیده می‌شود.",'<style>\n.o{display:none;position:fixed;inset:0;background:#000c;place-items:center}\n.o:target{display:grid}\n.o img{max-width:80%;border-radius:12px}\n</style>\n<a href="#big"><img src="'+PH+'" width="140" alt="Open" style="cursor:zoom-in"></a>\n<a class="o" id="big" href="#"><img src="'+PH+'" alt="Large"></a>');
C("CSS Image Centering","وسط‌چین کردن تصویر","Make the image display:block with margin: 0 auto, or center it with Grid/Flexbox on the parent.","تصویر را display:block با margin: 0 auto کن یا با گرید/فلکس روی والد وسط‌چین کن.",'<style>\n.a img{display:block;margin:0 auto}\n.b{display:grid;place-items:center;height:120px;background:#eef;margin-top:8px}\n</style>\n<div class="a"><img src="'+PH+'" width="100" alt=""></div>\n<div class="b"><img src="'+PH+'" width="80" alt=""></div>');
C("CSS Image Filters","فیلتر تصاویر","filter applies effects: blur(), grayscale(), sepia(), brightness(), contrast(), hue-rotate() and drop-shadow(). Combine several in one value.","filter افکت اعمال می‌کند: blur()، grayscale()، sepia()، brightness()، contrast()، hue-rotate() و drop-shadow(). چند تا را در یک مقدار ترکیب کن.",'<style>\nimg{width:90px;margin:4px;border-radius:8px;transition:.3s}\nimg:hover{filter:none!important}\n</style>\n<img style="filter:grayscale(1)" src="'+PH+'"><img style="filter:sepia(1)" src="'+PH+'"><img style="filter:blur(2px)" src="'+PH+'"><img style="filter:hue-rotate(120deg)" src="'+PH+'">');
C("CSS Image Shapes","شکل‌های تصویر","clip-path cuts an element to a shape (circle, polygon, ellipse). shape-outside makes text wrap around a floated shape.","clip-path المان را به یک شکل (circle، polygon، ellipse) می‌برد. shape-outside متن را دور یک شکل شناور می‌پیچاند.",'<style>\nimg{width:110px;margin:6px}\n.c{clip-path:circle(50%)}\n.p{clip-path:polygon(50% 0,100% 100%,0 100%)}\n</style>\n<img class="c" src="'+PH+'"><img class="p" src="'+PH+'">');
C("CSS object-fit","object-fit","object-fit controls how an image fills its box: cover (crop to fill), contain (fit inside), fill (stretch) and none.","object-fit نحوهٔ پر کردن جعبه با تصویر را تعیین می‌کند: cover (برش برای پر شدن)، contain (جا شدن درون)، fill (کشیده شدن) و none.",'<style>\nimg{width:110px;height:110px;margin:4px;background:#eee}\n</style>\n<img style="object-fit:cover" src="'+PH+'"><img style="object-fit:contain" src="'+PH+'"><img style="object-fit:fill" src="'+PH+'">');
C("CSS object-position","object-position","object-position chooses which part of a cropped image stays visible, such as left top or 20% 80%.","object-position مشخص می‌کند کدام بخش تصویر برش‌خورده دیده شود، مثل left top یا 20% 80%.",'<style>\nimg{width:110px;height:110px;object-fit:cover;margin:4px}\n</style>\n<img style="object-position:left" src="'+PH+'"><img style="object-position:center" src="'+PH+'"><img style="object-position:right" src="'+PH+'">');
C("CSS Masking","ماسک","mask-image hides parts of an element using an image or gradient: black or opaque areas show, transparent areas hide.","mask-image بخشی از المان را با تصویر یا گرادیان مخفی می‌کند: ناحیه‌های مات نمایش داده و شفاف پنهان می‌شوند.",'<style>\nimg{width:240px;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}\n</style>\n<img src="'+PH+'">');
C("CSS Buttons","دکمه‌ها","Good buttons have padding, a clear hover, an active press state, a visible focus ring and cursor: pointer. Transitions make them feel alive.","دکمهٔ خوب padding، hover واضح، حالت فشار، حلقهٔ فوکوس قابل‌دید و cursor: pointer دارد. ترنزیشن آن را زنده می‌کند.",'<style>\n.b{padding:12px 26px;border:0;border-radius:999px;background:#5b3df5;color:#fff;font:600 16px sans-serif;cursor:pointer;box-shadow:0 6px 0 #3a22b8;transition:.15s}\n.b:hover{background:#6e54ff}\n.b:active{transform:translateY(4px);box-shadow:0 2px 0 #3a22b8}\n.b:focus-visible{outline:3px solid #ffb020;outline-offset:3px}\n</style>\n<button class="b">Press me</button>');
C("CSS Pagination","صفحه‌بندی","Pagination is a row of links; mark the current page with an active class and give every link enough click area.","صفحه‌بندی ردیفی از لینک‌هاست؛ صفحهٔ جاری را با کلاس active مشخص کن و به هر لینک مساحت کلیک کافی بده.",'<style>\n.pg{display:flex;gap:4px}\n.pg a{padding:8px 14px;border:1px solid #ccd;border-radius:8px;color:#14173d;text-decoration:none}\n.pg a.on{background:#5b3df5;color:#fff;border-color:#5b3df5}\n.pg a:hover:not(.on){background:#eef}\n</style>\n<nav class="pg"><a href="#">«</a><a href="#">1</a><a class="on" href="#">2</a><a href="#">3</a><a href="#">»</a></nav>');
C("CSS Multiple Columns","چند ستونه","column-count or column-width flows text into newspaper-style columns; add column-gap and column-rule for style.","column-count یا column-width متن را به سبک روزنامه در چند ستون می‌ریزد؛ column-gap و column-rule را برای ظاهر اضافه کن.",'<style>\n.c{column-count:3;column-gap:24px;column-rule:2px solid #5b3df5;text-align:justify}\n</style>\n<div class="c">Newspaper columns split long text automatically. Newspaper columns split long text automatically. Newspaper columns split long text automatically. Newspaper columns split long text automatically. Newspaper columns split long text automatically.</div>');
C("CSS User Interface","رابط کاربری","UI properties include resize, cursor, accent-color, caret-color, user-select, appearance and scroll-behavior.","ویژگی‌های UI شامل resize، cursor، accent-color، caret-color، user-select، appearance و scroll-behavior است.",'<style>\ntextarea{resize:vertical;caret-color:tomato;width:100%}\ninput[type=checkbox],input[type=range]{accent-color:#5b3df5}\n.n{user-select:none;cursor:not-allowed;color:#888}\n</style>\n<textarea>Resize vertically</textarea>\n<p><input type="checkbox" checked> <input type="range"></p>\n<p class="n">You cannot select this text</p>');
C("CSS Box Sizing","اندازه‌گیری جعبه","box-sizing: border-box makes width include padding and border, so sizes are predictable. Apply it to everything with *, *::before, *::after.","box-sizing: border-box باعث می‌شود width شامل padding و border باشد و اندازه‌ها قابل پیش‌بینی شوند. با *، *::before و *::after روی همه اعمال کن.",'<style>\n.a,.b{width:200px;padding:20px;border:5px solid #5b3df5;margin:6px;background:#eef}\n.b{box-sizing:border-box}\n</style>\n<div class="a">content-box (250px wide)</div><div class="b">border-box (200px wide)</div>');
C("CSS @property","@property","@property registers a custom property with a type, so the browser can animate it, for example a gradient angle.","@property یک متغیر سفارشی را با نوع ثبت می‌کند تا مرورگر بتواند آن را انیمیت کند، مثلاً زاویهٔ یک گرادیان.",'<style>\n@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}\n.g{height:120px;border-radius:14px;background:linear-gradient(var(--a),#5b3df5,#0fa97f);animation:r 3s linear infinite}\n@keyframes r{to{--a:360deg}}\n</style>\n<div class="g"></div>');
C("CSS Functions","توابع CSS","Useful functions: var(), calc(), min(), max(), clamp(), rgb(), hsl(), color-mix(), attr(), url() and repeat()/minmax() in Grid.","توابع مفید: var()، calc()، min()، max()، clamp()، rgb()، hsl()، color-mix()، attr()، url() و repeat()/minmax() در گرید.",'<style>\n:root{--c1:#5b3df5;--c2:#0fa97f}\n.m{height:70px;border-radius:10px;background:color-mix(in srgb,var(--c1) 50%,var(--c2))}\n.w{width:clamp(100px,50%,300px);background:hsl(40 100% 60%);padding:8px}\n</style>\n<div class="m"></div><div class="w">clamp width</div>');
C("Flex Container","والد فلکس","Container properties: display:flex, flex-direction, flex-wrap, justify-content (main axis), align-items (cross axis), align-content and gap.","ویژگی‌های والد: display:flex، flex-direction، flex-wrap، justify-content (محور اصلی)، align-items (محور عرضی)، align-content و gap.",'<style>\n.f{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:space-around;align-items:center;gap:10px;height:140px;background:#eef}\n.f div{background:#5b3df5;color:#fff;padding:14px 20px}\n</style>\n<div class="f"><div>1</div><div style="padding:30px">2</div><div>3</div></div>');
C("Flex Items","آیتم‌های فلکس","Item properties: flex-grow, flex-shrink, flex-basis (shorthand flex: 1 1 200px), order, align-self and margin: auto.","ویژگی‌های آیتم: flex-grow، flex-shrink، flex-basis (مخفف flex: 1 1 200px)، order، align-self و margin: auto.",'<style>\n.f{display:flex;gap:8px;height:110px;background:#eef}\n.f div{background:#0fa97f;color:#fff;padding:10px}\n.g{flex:1}.e{flex:2;background:#5b3df5}.s{align-self:flex-end;order:-1;background:tomato}\n</style>\n<div class="f"><div class="g">flex 1</div><div class="e">flex 2</div><div class="s">order -1</div></div>');
C("Flex Responsive","فلکس واکنش‌گرا","flex-wrap with flex: 1 1 200px gives cards that wrap into rows automatically, with no media queries.","flex-wrap با flex: 1 1 200px کارت‌هایی می‌دهد که بدون مدیا کوئری خودشان در سطرها می‌شکنند.",'<style>\n.f{display:flex;flex-wrap:wrap;gap:10px}\n.f div{flex:1 1 140px;background:#5b3df5;color:#fff;padding:20px;border-radius:10px}\n</style>\n<div class="f"><div>Card 1</div><div>Card 2</div><div>Card 3</div><div>Card 4</div></div>');
C("Grid Container","والد گرید","Container properties: display:grid, grid-template-columns/rows, gap, grid-template-areas, justify-items, align-items and place-content.","ویژگی‌های والد: display:grid، grid-template-columns/rows، gap، grid-template-areas، justify-items، align-items و place-content.",'<style>\n.g{display:grid;grid-template-columns:100px 1fr 2fr;grid-auto-rows:50px;gap:8px}\n.g div{background:#0fa97f;color:#fff;display:grid;place-items:center}\n</style>\n<div class="g"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>');
C("Grid Items","آیتم‌های گرید","Place items with grid-column and grid-row (for example 1 / span 2), grid-area, justify-self and align-self.","آیتم‌ها را با grid-column و grid-row (مثلاً 1 / span 2)، grid-area، justify-self و align-self جایگذاری کن.",'<style>\n.g{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:46px;gap:6px}\n.g div{background:#5b3df5;color:#fff;display:grid;place-items:center}\n.w{grid-column:1 / span 2;background:tomato!important}\n.t{grid-row:1 / span 2;grid-column:4;background:#0fa97f!important}\n</style>\n<div class="g"><div class="w">span 2 cols</div><div class="t">span 2 rows</div><div>3</div><div>4</div><div>5</div></div>');
C("Grid 12-column Layout","چیدمان ۱۲ ستونه","A 12-column grid divides the width into 12 equal parts. Items span any number of them, like col-4, col-8, col-12.","گرید ۱۲ ستونه عرض را به ۱۲ بخش برابر تقسیم می‌کند. هر آیتم هر تعدادی از آن‌ها را می‌گیرد، مثل col-4 و col-8 و col-12.",'<style>\n.r{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-bottom:8px}\n.r>div{background:#5b3df5;color:#fff;padding:10px;text-align:center}\n.c4{grid-column:span 4}.c8{grid-column:span 8}.c6{grid-column:span 6}.c12{grid-column:span 12}\n</style>\n<div class="r"><div class="c4">4</div><div class="c8">8</div></div><div class="r"><div class="c6">6</div><div class="c6">6</div></div><div class="r"><div class="c12">12</div></div>');
C("CSS @supports","@supports","@supports applies CSS only if the browser understands a feature, giving a safe fallback for new properties.","@supports فقط وقتی مرورگر یک ویژگی را بشناسد CSS را اعمال می‌کند و برای ویژگی‌های جدید جایگزین امن می‌دهد.",'<style>\n.b{background:#ddd;padding:16px}\n@supports (display:grid){.b{background:#cfe;border:3px solid #0fa97f}}\n@supports not (display:grid){.b{border:3px solid tomato}}\n</style>\n<div class="b">Green border means grid is supported.</div>');
C("RWD Intro","مقدمه طراحی واکنش‌گرا","Responsive Web Design makes one page look good on phones, tablets and desktops using flexible grids, flexible images and media queries.","طراحی وب واکنش‌گرا با گرید انعطاف‌پذیر، تصاویر انعطاف‌پذیر و مدیا کوئری، یک صفحه را روی موبایل، تبلت و دسکتاپ خوب نشان می‌دهد.",'<style>\n.box{padding:20px;color:#fff;background:#5b3df5}\n@media (min-width:480px){.box{background:#0fa97f}}\n</style>\n<div class="box">Purple when narrow, green when wide. Resize the result panel.</div>');
C("RWD Viewport","وی‌پورت","The viewport meta tag tells phones to use the real device width. Without it, mobile browsers shrink a desktop-sized page.","متای viewport به گوشی می‌گوید از عرض واقعی دستگاه استفاده کند. بدون آن، مرورگر موبایل صفحهٔ اندازهٔ دسکتاپ را کوچک می‌کند.",'<meta name="viewport" content="width=device-width, initial-scale=1">\n<p>Add this meta tag inside head on every page.</p>');
C("RWD Grid View","گرید واکنش‌گرا","A responsive grid view changes the number of columns by screen size: 4 on desktop, 2 on tablets, 1 on phones.","گرید واکنش‌گرا تعداد ستون‌ها را با اندازهٔ صفحه عوض می‌کند: ۴ در دسکتاپ، ۲ در تبلت و ۱ در موبایل.",'<style>\n.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\n.g div{background:#5b3df5;color:#fff;padding:18px;text-align:center}\n@media (max-width:560px){.g{grid-template-columns:repeat(2,1fr)}}\n@media (max-width:320px){.g{grid-template-columns:1fr}}\n</style>\n<div class="g"><div>1</div><div>2</div><div>3</div><div>4</div></div>');
C("RWD Media Queries","مدیا کوئری واکنش‌گرا","Use mobile first: write base styles for phones, then add min-width queries for larger screens. Common breakpoints are 600px, 900px and 1200px.","موبایل‌محور بنویس: استایل پایه برای گوشی، بعد با min-width برای صفحه‌های بزرگ‌تر اضافه کن. نقاط شکست رایج ۶۰۰، ۹۰۰ و ۱۲۰۰ پیکسل است.",'<style>\nbody{font-size:16px;background:#fee}\n@media (min-width:480px){body{font-size:20px;background:#ffe}}\n@media (min-width:700px){body{font-size:24px;background:#efe}}\n</style>\n<p>Mobile first: base styles, then min-width upgrades.</p>');
C("RWD Images","تصاویر واکنش‌گرا","Use max-width: 100% and height: auto so images shrink with their container. The picture element and srcset serve different files per screen.","max-width: 100% و height: auto به‌کار ببر تا تصویر با ظرف کوچک شود. picture و srcset به هر صفحه فایل متفاوتی می‌دهند.",'<style>img{max-width:100%;height:auto;border-radius:10px}</style>\n<img src="'+PH+'" width="600" alt="Resizes with the container">\n<pre>&lt;img srcset="s.jpg 480w, l.jpg 1200w" sizes="100vw"&gt;</pre>');
C("RWD Videos","ویدیوهای واکنش‌گرا","Make videos and iframes fluid with width: 100% and aspect-ratio: 16 / 9, which keeps the shape at any width.","ویدیو و iframe را با width: 100% و aspect-ratio: 16 / 9 روان کن؛ در هر عرضی شکل حفظ می‌شود.",'<style>\n.v{width:100%;max-width:480px;aspect-ratio:16/9;background:#14173d;color:#fff;display:grid;place-items:center;border-radius:10px}\n</style>\n<div class="v">16:9 video area</div>\n<pre>video, iframe { width: 100%; aspect-ratio: 16 / 9; }</pre>');
C("RWD Frameworks","فریم‌ورک‌های واکنش‌گرا","CSS frameworks like Bootstrap and Tailwind provide ready grids and components. Learn plain CSS first, then use a framework to move faster.","فریم‌ورک‌های CSS مثل Bootstrap و Tailwind گرید و کامپوننت آماده می‌دهند. اول CSS خالص را یاد بگیر، بعد برای سرعت از فریم‌ورک استفاده کن.",'<pre>Bootstrap:  &lt;div class="row"&gt;&lt;div class="col-md-6"&gt;...&lt;/div&gt;&lt;/div&gt;\nTailwind:   &lt;div class="grid grid-cols-1 md:grid-cols-2 gap-4"&gt;...&lt;/div&gt;</pre>');
C("RWD Templates","قالب‌های واکنش‌گرا","A starter template: a viewport tag, a fluid container, a responsive grid and a small set of breakpoints. Copy it and build on it.","یک قالب شروع: تگ viewport، کانتینر روان، گرید واکنش‌گرا و چند نقطهٔ شکست کم. کپیش کن و روی آن بساز.",'<meta name="viewport" content="width=device-width, initial-scale=1">\n<style>\n*{box-sizing:border-box}body{margin:0;font-family:sans-serif}\n.wrap{max-width:1000px;margin:auto;padding:16px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}\n.card{background:#eef;padding:20px;border-radius:10px}\n</style>\n<div class="wrap"><h1>Template</h1><div class="grid"><div class="card">A</div><div class="card">B</div><div class="card">C</div></div></div>');
const QC={en:[["What does CSS stand for?",["Cascading Style Sheets","Computer Style Sheets","Creative Style System"],0],["Which property changes the text color?",["color","font-color","text-color"],0],["Which declaration creates a flex container?",["display: flex","flex: container","layout: flex"],0]],fa:[["CSS مخفف چیست؟",["Cascading Style Sheets","Computer Style Sheets","Creative Style System"],0],["کدام ویژگی رنگ متن را عوض می‌کند؟",["color","font-color","text-color"],0],["کدام تعریف یک کانتینر فلکس می‌سازد؟",["display: flex","flex: container","layout: flex"],0]]};
C("CSS Certificate","گواهی CSS","Finish every CSS lesson and the quiz, then type your name to preview your Frontino completion certificate.","همهٔ درس‌های CSS و آزمون را تمام کن، بعد نامت را بنویس تا پیش‌نمایش گواهی پایان دورهٔ فرانتینو را ببینی.",'<input id="n" value="Your Name" oninput="c.textContent=this.value">\n<style>\n.cert{margin:12px;padding:24px;text-align:center;border:6px double #5b3df5;border-radius:14px;font-family:sans-serif}\n.cert h1{color:#5b3df5;margin:6px}\n</style>\n<div class="cert"><h2>Certificate of Completion</h2><p>This certifies that</p><h1 id="c">Your Name</h1><p>completed CSS at Frontino</p></div>');
C("SASS Tutorial","آموزش SASS","Sass is a CSS preprocessor: variables, nesting, mixins, partials and functions that compile to plain CSS. Install with npm install sass, then sass input.scss output.css.","Sass پیش‌پردازندهٔ CSS است: متغیر، تودرتویی، mixin، partial و تابع که به CSS معمولی کامپایل می‌شوند. با npm install sass نصب کن و با sass input.scss output.css کامپایل کن.",'<pre>// input.scss\n$brand: #5b3df5;\n@mixin pill($c) { background: $c; border-radius: 999px; }\n.card {\n  color: $brand;\n  .btn { @include pill($brand); &:hover { opacity: .8; } }\n}</pre>\n<style>.card{color:#5b3df5}.card .btn{background:#5b3df5;border-radius:999px;color:#fff;padding:8px 16px;border:0}.card .btn:hover{opacity:.8}</style>\n<div class="card">Compiled result: <button class="btn">Pill button</button></div>');
C("CSS Templates","قالب‌های CSS","A clean landing-page template: hero, three feature cards and a call-to-action, built with Grid and a few variables.","یک قالب لندینگ تمیز: هیرو، سه کارت ویژگی و دکمهٔ فراخوان که با گرید و چند متغیر ساخته شده.",'<style>\n:root{--c:#5b3df5}*{box-sizing:border-box}body{margin:0;font-family:sans-serif}\n.hero{padding:40px 20px;text-align:center;background:linear-gradient(135deg,var(--c),#0fa97f);color:#fff}\n.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:20px}\n.f div{padding:20px;border-radius:12px;background:#f1f0ff}\n.cta{display:block;width:max-content;margin:0 auto 20px;padding:12px 26px;border-radius:999px;background:var(--c);color:#fff;text-decoration:none}\n</style>\n<div class="hero"><h1>Launch faster</h1><p>A simple landing page.</p></div>\n<div class="f"><div>Fast</div><div>Clean</div><div>Responsive</div></div><a class="cta" href="#">Get started</a>');
C("CSS Examples","مثال‌های CSS","A profile card mixing many ideas: variables, flexbox, border-radius, shadow, transitions and a hover lift.","یک کارت پروفایل که چند ایده را ترکیب می‌کند: متغیر، فلکس، border-radius، سایه، ترنزیشن و بلند شدن هنگام hover.",'<style>\n.p{display:flex;gap:14px;align-items:center;width:280px;padding:16px;border-radius:16px;background:#fff;box-shadow:0 6px 20px #0002;transition:.25s;font-family:sans-serif}\n.p:hover{transform:translateY(-6px);box-shadow:0 14px 30px #5b3df544}\n.a{width:54px;height:54px;border-radius:50%;background:conic-gradient(#5b3df5,#0fa97f,#ffb020,#5b3df5)}\n</style>\n<div class="p"><div class="a"></div><div><b>Sara Ahmadi</b><br><small>Front-end learner</small></div></div>');
C("CSS Editor","ویرایشگر CSS","This is your free CSS playground. Change anything, press Run (or Ctrl+Enter) and experiment.","این زمین بازی آزاد CSS توست. هر چیز را عوض کن، Run (یا Ctrl+Enter) بزن و آزمایش کن.",'<!DOCTYPE html>\n<html>\n<head>\n<style>\nbody { font-family: sans-serif; padding: 20px; }\nh1 { color: #5b3df5; }\n</style>\n</head>\n<body>\n<h1>My CSS playground</h1>\n<p>Edit the styles above.</p>\n</body>\n</html>');
C("CSS Snippets","اسنیپت‌های CSS","Handy snippets: a CSS reset, center anything, a visually-hidden class, a smooth-scroll rule and a responsive container.","اسنیپت‌های کاربردی: ریست CSS، وسط‌چین کردن هر چیز، کلاس مخفی بصری، اسکرول نرم و کانتینر واکنش‌گرا.",'<style>\n*,*::before,*::after{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\n.center{display:grid;place-items:center;min-height:100px;background:#eef}\n.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}\n.container{width:min(100% - 2rem,1000px);margin-inline:auto}\n</style>\n<div class="center container">Centered inside a container</div>');
C("CSS Quiz","آزمون CSS","Test your CSS knowledge with the three questions below.","با سه سؤال زیر دانش CSS خودت را بسنج.",'<h2 style="font-family:sans-serif">Quiz time 🎯</h2>');
C("CSS Exercises","تمرین‌های CSS","Answer the questions below, then try the challenge: make the box a circle and center the text.","به سؤال‌های زیر جواب بده، بعد چالش را امتحان کن: جعبه را دایره کن و متن را وسط‌چین کن.",'<style>\n.box{width:100px;height:100px;background:#5b3df5;color:#fff}\n/* Challenge: border-radius + centered text */\n</style>\n<div class="box">Hi</div>');
C("CSS Code Challenges","چالش‌های کد CSS","Challenge 1: build a pricing card with a highlighted badge. Challenge 2: a sticky header that gets a shadow. Challenge 3: a CSS-only toggle with :checked.","چالش ۱: کارت قیمت با نشانهٔ برجسته. چالش ۲: هدر چسبنده که سایه می‌گیرد. چالش ۳: سوییچ با فقط CSS با :checked.",'<style>\n.t{position:relative;display:inline-block;width:56px;height:30px}\n.t input{opacity:0;width:0;height:0}\n.s{position:absolute;inset:0;background:#bbb;border-radius:999px;transition:.25s}\n.s::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s}\ninput:checked + .s{background:#0fa97f}input:checked + .s::after{transform:translateX(26px)}\n</style>\n<label class="t"><input type="checkbox"><span class="s"></span></label>');
C("CSS Website","ساخت وب‌سایت با CSS","Project: style a full page with a sticky nav, hero, card grid and footer. Keep colors in variables and test at narrow widths.","پروژه: یک صفحهٔ کامل با ناوبر چسبنده، هیرو، گرید کارت و فوتر استایل کن. رنگ‌ها را در متغیر نگه دار و در عرض‌های کم تست کن.",'<style>\n:root{--c:#5b3df5}*{box-sizing:border-box}body{margin:0;font-family:sans-serif}\nnav{position:sticky;top:0;display:flex;gap:16px;padding:12px 20px;background:#14173d}nav a{color:#fff;text-decoration:none}\n.hero{padding:36px 20px;background:var(--c);color:#fff}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:16px}.cards div{background:#f1f0ff;padding:18px;border-radius:10px}\nfooter{padding:14px;text-align:center;background:#eee}\n</style>\n<nav><a href="#">Home</a><a href="#">About</a></nav><div class="hero"><h1>My site</h1></div>\n<div class="cards"><div>One</div><div>Two</div><div>Three</div></div><footer>Footer</footer>');
C("CSS Syllabus","سرفصل‌های CSS","Study order: selectors and the cascade, box model, text and color, layout (Flexbox, Grid), responsive design, transitions and animations.","ترتیب مطالعه: انتخابگر و cascade، مدل جعبه، متن و رنگ، چیدمان (فلکس و گرید)، طراحی واکنش‌گرا، ترنزیشن و انیمیشن.",'<ol>\n<li>Selectors and the cascade</li><li>Box model</li><li>Text and color</li><li>Layout: Flexbox and Grid</li><li>Responsive design</li><li>Transitions and animations</li>\n</ol>');
C("CSS Study Plan","برنامهٔ مطالعه CSS","A 4-week plan: week 1 basics and box model, week 2 text, color and backgrounds, week 3 Flexbox and Grid, week 4 responsive design plus a final site.","برنامهٔ چهارهفته‌ای: هفتهٔ ۱ مبانی و مدل جعبه، هفتهٔ ۲ متن، رنگ و پس‌زمینه، هفتهٔ ۳ فلکس و گرید، هفتهٔ ۴ طراحی واکنش‌گرا و سایت نهایی.",'<table border="1" cellpadding="6" style="border-collapse:collapse">\n<tr><td>Week 1</td><td>Basics, box model</td></tr>\n<tr><td>Week 2</td><td>Text, color, backgrounds</td></tr>\n<tr><td>Week 3</td><td>Flexbox and Grid</td></tr>\n<tr><td>Week 4</td><td>Responsive + final site</td></tr>\n</table>');
C("CSS Interview Prep","آمادگی مصاحبه CSS","Common questions: the box model, specificity, Flexbox vs Grid, position values, how to center a div, rem vs em, and what causes layout shift.","سؤال‌های رایج: مدل جعبه، اولویت، فلکس در برابر گرید، مقادیر position، نحوهٔ وسط‌چین کردن div، rem در برابر em و علت پرش چیدمان.",'<ul>\n<li>Flexbox = one dimension, Grid = two dimensions</li>\n<li>Center a div: display:grid; place-items:center</li>\n<li>rem is relative to the root font, em to the parent</li>\n<li>Specificity: inline &gt; id &gt; class &gt; element</li>\n</ul>');
C("CSS Reference","مرجع CSS","The most used properties: color, background, border, margin, padding, width, height, display, position, flex, grid, font, transition, transform.","پرکاربردترین ویژگی‌ها: color، background، border، margin، padding، width، height، display، position، flex، grid، font، transition و transform.",'<style>td,th{padding:6px 12px;border:1px solid #ccd}table{border-collapse:collapse}</style>\n<table><tr><th>Group</th><th>Properties</th></tr><tr><td>Box</td><td>margin, padding, border, width, height</td></tr><tr><td>Text</td><td>color, font, line-height, text-align</td></tr><tr><td>Layout</td><td>display, position, flex, grid</td></tr><tr><td>Motion</td><td>transition, transform, animation</td></tr></table>');
C("CSS Selectors Reference","مرجع انتخابگرها","* all, element, .class, #id, [attr], a, b (group), a b (descendant), a > b (child), a + b, a ~ b, :pseudo-class, ::pseudo-element.","* همه، element، .class، #id، [attr]، a, b (گروه)، a b (نسل)، a > b (فرزند)، a + b، a ~ b، :pseudo-class و ::pseudo-element.",'<style>\n.demo *{outline:1px dashed #ccd;padding:2px}\n.demo p, .demo h4{color:#5b3df5}\n.demo > span{color:tomato}\n</style>\n<div class="demo"><h4>Heading</h4><p>Paragraph</p><span>child span</span></div>');
C("CSS Combinators Reference","مرجع ترکیب‌کننده‌ها","Space = descendant, > = direct child, + = next sibling, ~ = any following sibling.","فاصله = نسل، > = فرزند مستقیم، + = هم‌روند بعدی، ~ = هر هم‌روند بعدی.",'<style>\nul li{color:#5b3df5}ul > li{font-weight:bold}h4 + p{color:tomato}h4 ~ small{color:teal}\n</style>\n<ul><li>list item</li></ul><h4>Title</h4><p>next sibling</p><small>following sibling</small>');
C("CSS Pseudo-classes Reference","مرجع شبه‌کلاس‌ها","State: :hover :focus :active :visited :checked :disabled :required :valid. Position: :first-child :last-child :nth-child() :only-child. Logic: :not() :is() :where() :has().","حالت: :hover :focus :active :visited :checked :disabled :required :valid. جایگاه: :first-child :last-child :nth-child() :only-child. منطق: :not() :is() :where() :has().",'<style>\nli:not(:last-child){border-bottom:1px solid #ccd}\nform:has(input:invalid) button{opacity:.4}\ninput:required:valid{border:2px solid #0fa97f}\n</style>\n<ul><li>One</li><li>Two</li><li>Three</li></ul>\n<form><input required placeholder="Type something"> <button>Send</button></form>');
C("CSS Pseudo-elements Reference","مرجع شبه‌المان‌ها","::before, ::after, ::first-letter, ::first-line, ::selection, ::placeholder, ::marker, ::backdrop and ::file-selector-button.","::before، ::after، ::first-letter، ::first-line، ::selection، ::placeholder، ::marker، ::backdrop و ::file-selector-button.",'<style>\nli::marker{color:#5b3df5;font-weight:bold}\ninput::placeholder{color:tomato}\ninput::file-selector-button{background:#5b3df5;color:#fff;border:0;padding:6px 10px;border-radius:6px}\n</style>\n<ul><li>Colored marker</li></ul><input placeholder="Styled placeholder"><br><input type="file">');
C("CSS At-rules","قاعده‌های @","At-rules: @media, @supports, @font-face, @keyframes, @import, @charset, @layer, @container and @property.","قاعده‌های @: @media، @supports، @font-face، @keyframes، @import، @charset، @layer، @container و @property.",'<style>\n.box{container-type:inline-size;border:2px solid #5b3df5;padding:8px}\n.in{background:#fcc;padding:10px}\n@container (min-width:300px){.in{background:#cfc}}\n</style>\n<div class="box"><div class="in">@container: green when the box is 300px+ wide</div></div>');
C("CSS Functions Reference","مرجع توابع","Color: rgb hsl hwb oklch color-mix. Math: calc min max clamp. Other: var env attr url counter, plus transform functions like translate rotate scale.","رنگ: rgb hsl hwb oklch color-mix. ریاضی: calc min max clamp. بقیه: var env attr url counter و توابع ترنسفرم مثل translate rotate scale.",'<style>\n.a{background:oklch(65% .2 280);color:#fff;padding:10px;margin:4px}\n.b{background:hwb(160 10% 20%);color:#fff;padding:10px;margin:4px}\n</style>\n<div class="a">oklch()</div><div class="b">hwb()</div>');
C("CSS Reference Aural","مرجع صوتی","Aural (speech) CSS such as voice-family and pitch is obsolete. Today build for screen readers with semantic HTML, ARIA and visually-hidden text.","CSS صوتی (گفتاری) مثل voice-family و pitch منسوخ است. امروز برای صفحه‌خوان‌ها با HTML معنایی، ARIA و متن مخفی بصری بساز.",'<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}button{padding:8px 14px}</style>\n<button>🔍 <span class="sr-only">Search</span></button>\n<p>Screen readers announce: Search, button.</p>');
C("CSS Web Safe Fonts","فونت‌های امن وب","Web-safe fonts exist on most devices: Arial, Verdana, Tahoma, Trebuchet MS, Times New Roman, Georgia, Courier New. Always end the stack with a generic family.","فونت‌های امن وب روی بیشتر دستگاه‌ها هستند: Arial، Verdana، Tahoma، Trebuchet MS، Times New Roman، Georgia و Courier New. انتهای لیست یک خانوادهٔ عمومی بگذار.",'<p style="font-family:Arial,sans-serif">Arial</p>\n<p style="font-family:Verdana,sans-serif">Verdana</p>\n<p style="font-family:Tahoma,sans-serif">Tahoma</p>\n<p style="font-family:Georgia,serif">Georgia</p>\n<p style="font-family:&quot;Courier New&quot;,monospace">Courier New</p>');
C("CSS Animatable","ویژگی‌های قابل انیمیت","Many properties animate smoothly: color, background-color, opacity, transform, width, height, margin, padding, border-radius, box-shadow, filter. display does not.","بیشتر ویژگی‌ها نرم انیمیت می‌شوند: color، background-color، opacity، transform، width، height، margin، padding، border-radius، box-shadow و filter. display نه.",'<style>\n.a{width:80px;height:60px;background:#5b3df5;border-radius:6px;transition:all .6s}\n.a:hover{width:200px;background:tomato;border-radius:30px;box-shadow:0 10px 20px #0004}\n</style>\n<div class="a"></div><p>Hover the box.</p>');
C("CSS Units Reference","مرجع واحدها","Absolute: px cm mm in pt. Relative: em rem % ch ex. Viewport: vw vh vmin vmax and dvh for mobile. Grid: fr. Angles: deg rad turn. Time: s ms.","مطلق: px cm mm in pt. نسبی: em rem % ch ex. صفحه نمایش: vw vh vmin vmax و dvh برای موبایل. گرید: fr. زاویه: deg rad turn. زمان: s ms.",'<style>.u div{background:#5b3df5;color:#fff;margin:4px 0;padding:4px}</style>\n<div class="u"><div style="width:10vw">10vw</div><div style="width:40ch">40ch</div><div style="width:12rem">12rem</div><div style="width:25%">25%</div></div>');
C("CSS Color Values","مقادیر رنگ","Colors: names (140), HEX (#rrggbb, #rgb, #rrggbbaa), rgb()/rgba(), hsl()/hsla(), hwb(), oklch() and the keywords transparent and currentColor.","رنگ‌ها: نام (۱۴۰ تا)، HEX (#rrggbb، #rgb، #rrggbbaa)، rgb()/rgba()، hsl()/hsla()، hwb()، oklch() و کلمات transparent و currentColor.",'<style>.c{display:inline-block;width:70px;height:50px;margin:4px;color:#fff;font:12px monospace;padding:4px}</style>\n<div class="c" style="background:rebeccapurple">name</div><div class="c" style="background:#0fa97f">hex</div><div class="c" style="background:rgb(255 99 71)">rgb</div><div class="c" style="background:hsl(200 80% 45%)">hsl</div><div class="c" style="background:#5b3df580;color:#000">hex+a</div>');
C("CSS Default Values","مقادیر پیش‌فرض","Default values: display depends on the element, position: static, margin: 0 (but body has 8px), color: black, font-size: 16px, opacity: 1, box-sizing: content-box.","مقادیر پیش‌فرض: display بسته به المان، position: static، margin: 0 (ولی body ۸ پیکسل دارد)، color: black، font-size: 16px، opacity: 1 و box-sizing: content-box.",'<p id="o"></p>\n<script>\nconst cs = getComputedStyle(document.body);\no.textContent = "body margin: " + cs.margin + ", font-size: " + cs.fontSize + ", color: " + cs.color + ", position: " + cs.position;\n<\/script>');
C("CSS Browser Support","پشتیبانی مرورگرها","Modern browsers support almost all CSS. Check caniuse.com or MDN before using new features, and use @supports for graceful fallbacks.","مرورگرهای مدرن بیشتر CSS را پشتیبانی می‌کنند. قبل از قابلیت جدید caniuse.com یا MDN را ببین و با @supports جایگزین مناسب بگذار.",'<p id="o"></p>\n<script>\nconst f = ["display:grid", "aspect-ratio:1", "backdrop-filter:blur(2px)", "container-type:inline-size", "selector(:has(a))"];\no.innerHTML = f.map(x => x + ": " + CSS.supports(x.startsWith("selector") ? x : x)).join("<br>");\n<\/script>');

F("html","HTML Introduction",["HTML مخفف HyperText Markup Language است؛ زبان استاندارد ساخت صفحات وب که ساختار صفحه را با المان‌ها توصیف می‌کند.","مرورگر فایل HTML را می‌خواند و تگ‌ها را به عنوان، پاراگراف، تصویر و لینک تبدیل می‌کند."]);
F("html","HTML Elements",["هر المان HTML از یک تگ شروع، محتوا و یک تگ پایان ساخته می‌شود. بعضی المان‌ها مثل br و img محتوا و تگ پایان ندارند.","المان‌ها داخل هم قرار می‌گیرند و هر صفحه درختی از المان‌هاست که از html شروع می‌شود."]);
F("html","HTML Attributes",["اتریبیوت‌ها اطلاعات اضافه به المان می‌دهند و همیشه به شکل name=«value» در تگ شروع می‌آیند.","پرکاربردها: href برای لینک، src و alt برای تصویر، class و id برای استایل و lang برای زبان صفحه."]);
F("html","HTML Headings",["HTML شش سطح عنوان دارد (h1 تا h6). h1 را برای عنوان اصلی بگذار و سطح‌ها را جا نینداز؛ موتورهای جستجو و صفحه‌خوان‌ها به این ترتیب تکیه می‌کنند."]);
F("html","HTML Links",["لینک‌ها با المان a ساخته می‌شوند و مقصد در href است. با target=«_blank» لینک در تب جدید باز می‌شود."]);
F("html","HTML Forms",["فرم‌ها ورودی کاربر را می‌گیرند. form ورودی‌ها و دکمهٔ ارسال را در بر می‌گیرد و هر ورودی برای دسترس‌پذیری یک label می‌خواهد."]);
F("css","CSS Introduction",["CSS مخفف Cascading Style Sheets است و رنگ، فاصله، فونت و چیدمان را کنترل می‌کند تا HTML فقط به ساختار بپردازد.","هر قانون CSS یک انتخابگر و بلوکی از تعریف‌هاست: selector { property: value; }"]);
F("css","CSS Selectors",["انتخابگرها مشخص می‌کنند قانون روی کدام المان‌ها اعمال شود: المان (p)، کلاس (.card)، آیدی (#top) و ترکیب‌ها مثل nav a."]);
F("css","CSS Box Model",["هر المان یک جعبه است: محتوا، padding، border و margin. box-sizing: border-box را بگذار تا width شامل padding و border شود."]);
F("css","CSS Animations",["انیمیشن‌ها با @keyframes مراحل را تعریف می‌کنند و با ویژگی‌های animation اجرا می‌شوند. برای کاربرانی که حرکت کمتر می‌خواهند از prefers-reduced-motion استفاده کن."]);
F("css","Flexbox Intro",["فلکس‌باکس چیدمان یک‌بعدی است. به والد display:flex بده و با justify-content و align-items فرزندان را جابه‌جا کن."]);
F("css","Grid Intro",["گرید المان‌ها را در سطر و ستون می‌چیند. ستون‌ها را با grid-template-columns تعریف کن؛ واحد fr فضای خالی را تقسیم می‌کند."]);
F("js","JS Introduction",["جاوااسکریپت زبان برنامه‌نویسی وب است. صفحه را تعاملی می‌کند: واکنش به کلیک، اعتبارسنجی فرم، تغییر محتوا و ارتباط با سرور.","در همهٔ مرورگرها و با Node.js بیرون از مرورگر اجرا می‌شود."]);
F("js","JS Output",["خروجی را با console.log() برای دیباگ، document.write() فقط برای آزمایش یا تغییر textContent المان (روش واقعی صفحات) نشان بده."]);
F("js","JS Syntax",["متغیرها را با let (قابل تغییر) یا const (غیرقابل تغییر) تعریف کن. جمله‌ها با سمی‌کالن تمام می‌شوند و نام‌ها به بزرگی و کوچکی حروف حساس‌اند."]);
F("js","JS Functions",["تابع بلوکی از کد قابل استفادهٔ دوباره است. توابع فلشی نحو کوتاه‌تری دارند و در کد مدرن رایج‌اند."]);
F("js","JS Arrays",["آرایه‌ها لیست مرتب نگه می‌دارند. متدهای map و filter و reduce داده را بدون حلقهٔ دستی تبدیل می‌کنند."]);
F("js","JS Fetch API",["fetch() داده را از شبکه می‌گیرد و یک Promise برمی‌گرداند. برای خواندن پاسخ از async/await استفاده کن."]);
F("react","React Intro",["ری‌اکت کتابخانهٔ جاوااسکریپت برای ساخت رابط کاربری از قطعه‌های کوچک و قابل‌استفادهٔ دوباره به نام کامپوننت است. شما ظاهر UI را برای وضعیت فعلی توصیف می‌کنید و ری‌اکت صفحه را بهینه به‌روز می‌کند."]);
F("react","React Components",["کامپوننت تابعی است که JSX برمی‌گرداند. نام کامپوننت با حرف بزرگ شروع می‌شود و مثل تگ HTML به کار می‌رود."]);
F("react","React Props",["پراپس داده را از والد به فرزند می‌دهد و داخل فرزند فقط‌خواندنی است."]);
F("react","React useState",["هوک useState مقداری را نگه می‌دارد که در طول زمان تغییر می‌کند. صدا زدن setter کامپوننت را با مقدار جدید دوباره رندر می‌کند."]);
F("react","React useEffect",["useEffect بعد از رندر کد اجرا می‌کند، مثل تایمر یا گرفتن داده. تابع پاکسازی برگردان تا کار شروع‌شده متوقف شود."]);
A("html","HTML Paragraphs",["The <p> element defines a paragraph. Browsers add space above and below it, and collapse extra spaces and line breaks. Use <br> for a line break and <hr> for a divider."],'<p>First paragraph.</p>\n<p>Second paragraph<br>with a line break.</p>\n<hr>\n<pre>Preformatted\n   keeps spaces.</pre>',["المان p یک پاراگراف می‌سازد. مرورگر بالا و پایینش فاصله می‌گذارد و فاصله‌ها و خط‌های اضافه را یکی می‌کند. برای رفتن به خط بعد از br و برای خط جداکننده از hr استفاده کن."]);
A("html","HTML Images",["Images use the <img> element with src (the file) and alt (a text description for screen readers and broken links). Set width or height to control the size."],'<img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27160%27 height=%2780%27%3E%3Crect width=%27160%27 height=%2780%27 fill=%27%235b3df5%27/%3E%3C/svg%3E" alt="A purple banner" width="160">',["تصویر با المان img و ویژگی‌های src (فایل) و alt (توضیح متنی برای صفحه‌خوان‌ها و زمان خراب شدن تصویر) ساخته می‌شود. اندازه را با width و height تعیین کن."]);
A("html","HTML Tables",["Tables show data in rows and columns: <table> holds <tr> rows made of <th> headers and <td> cells. Use tables for data, never for page layout."],'<table border="1" cellpadding="6">\n  <tr><th>Language</th><th>Used for</th></tr>\n  <tr><td>HTML</td><td>Structure</td></tr>\n  <tr><td>CSS</td><td>Style</td></tr>\n</table>',["جدول داده را در سطر و ستون نشان می‌دهد: table شامل سطرهای tr با سرستون‌های th و خانه‌های td است. جدول را برای داده به کار ببر، نه برای چیدمان صفحه."]);
A("html","HTML Lists",["Use <ul> for bullet lists, <ol> for numbered lists, and <li> for each item. Lists can be nested."],'<ul>\n  <li>Coffee</li>\n  <li>Tea</li>\n</ul>\n<ol>\n  <li>Learn HTML</li>\n  <li>Learn CSS</li>\n</ol>',["ul برای لیست نقطه‌ای، ol برای لیست شماره‌دار و li برای هر آیتم است. لیست‌ها را می‌شود تو در تو نوشت."]);
A("html","HTML Tag List",["The most used tags: html, head, body, h1–h6, p, a, img, ul/ol/li, table, form/input/button, div, span, header, nav, main, section, article, footer."],'<header>header</header>\n<nav>nav</nav>\n<main>\n  <section>section</section>\n  <article>article</article>\n</main>\n<footer>footer</footer>',["پرکاربردترین تگ‌ها: html، head، body، h1 تا h6، p، a، img، ul/ol/li، table، form/input/button، div، span، header، nav، main، section، article و footer."]);

const SNIP=[`<h1>Hello, Frontino!</h1>\n<p>I wrote this myself.</p>\n<button onclick="this.textContent='✔ Works'">Click me</button>`,`<style>\nbody{background:#0b0f1a;display:grid;place-items:center;height:90vh;margin:0}\n.b{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#7c5cff,#22e3b4);animation:r 2s infinite}\n@keyframes r{50%{transform:rotate(180deg) scale(1.4)}}\n</style>\n<div class="b"></div>`,`<h2 id="o" style="font:700 48px sans-serif;margin:8px">0</h2>\n<script>\nlet n = 0;\nsetInterval(() => o.textContent = ++n, 300);\n<\/script>`];
function typeLoop(){const pre=$("#dt"),f=$("#df");if(!pre)return;clearTimeout(window._ty);let k=0,i=0;const step=()=>{if(!pre.isConnected)return;const c=SNIP[k];i++;pre.innerHTML=hlt(c.slice(0,i),"html");if(i%5===0||i===c.length)f.srcdoc=c.slice(0,i);if(i>=c.length){window._ty=setTimeout(()=>{k=(k+1)%SNIP.length;i=0;step()},3200)}else window._ty=setTimeout(step,32)};step()}
function sc(){const h=document.documentElement,mx=h.scrollHeight-innerHeight;h.style.setProperty("--sp",mx>0?scrollY/mx:0);document.querySelectorAll("[data-sp]").forEach(el=>{const r=el.getBoundingClientRect(),t=r.height-innerHeight,p=t>0?Math.min(1,Math.max(0,-r.top/t)):0;el.style.setProperty("--p",p);if(el.classList.contains("how"))el.dataset.s=Math.min(3,Math.floor(p*4))})}

 if(!_io){_io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");_io.unobserve(e.target)}}),{threshold:.12});

 document.querySelectorAll(".rv").forEach(e=>_io.observe(e));document.querySelectorAll(".num").forEach(e=>_cio.observe(e));
 document.querySelectorAll("[data-sc]").forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.querySelector(".dev");if(t)window.scrollTo({top:t.offsetTop,behavior:"smooth"})});

 sc()}
