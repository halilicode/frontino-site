<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#0b1220;--mut:#56627d;--line:#d8e0ef;--vio:#2f5bff;--mint:#079f7a;--amb:#e08a00;--code:#0b1220;--codeink:#e6edf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#020305;--card:#0a0d13;--ink:#e6edf7;--mut:#8b9ab8;--line:#171d2a;--vio:#5b8cff;--mint:#22e3b4;--amb:#ffb454;--code:#04060a;--codeink:#e6edf7}}
:root[data-theme="dark"]{--bg:#020305;--card:#0a0d13;--ink:#e6edf7;--mut:#8b9ab8;--line:#171d2a;--vio:#5b8cff;--mint:#22e3b4;--amb:#ffb454;--code:#04060a;--codeink:#e6edf7}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Inter","Segoe UI",system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%;transition:background .3s}
html[lang=fa] body,html[lang=ar] body{font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif}
html[lang=zh] body{font-family:"Noto Sans SC",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-block-end:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;color:var(--ink);text-decoration:none;display:flex;gap:8px;align-items:center}
.logo i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 0deg,var(--vio),var(--mint),var(--amb),var(--vio));animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto}
nav a{padding:6px 14px;border-radius:999px;color:var(--mut);text-decoration:none;font-weight:600;white-space:nowrap;transition:.25s}
nav a.on,nav a:hover{background:var(--vio);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.pri{background:var(--vio);color:#fff;border-color:transparent}
.lang{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;min-width:150px;box-shadow:0 14px 40px #0003}
.menu.open{display:block;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu button{display:block;width:100%;text-align:start;padding:8px 12px;border:0;background:none;color:var(--ink);font:inherit;border-radius:8px;cursor:pointer}
.menu button:hover,.menu button.on{background:var(--vio);color:#fff}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;max-width:1180px;margin:0 auto;padding:56px 22px 30px}
.hero h1{font-size:clamp(32px,6vw,72px);line-height:1.05;margin:0 0 18px;font-weight:800;letter-spacing:-.03em}
.hero h1 span{display:inline-block;background:linear-gradient(90deg,var(--vio),var(--mint),var(--amb),var(--vio));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.hero p{color:var(--mut);font-size:19px;max-width:48ch}
.demo{border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px #5b3df533;transform:rotate(-1.5deg);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(-5deg)}}
.demo pre{margin:0;padding:18px;min-height:190px;background:var(--code);color:var(--codeink);font:14px/1.6 "JetBrains Mono",monospace;direction:ltr;text-align:left;white-space:pre-wrap}
.demo pre::after{content:"▌";animation:blink 1s steps(2) infinite;color:var(--mint)}
@keyframes blink{50%{opacity:0}}
.demo iframe{width:100%;height:130px;border:0;background:#fff;display:block}
.cards{max-width:1180px;margin:0 auto;padding:10px 22px 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;color:var(--ink);position:relative;overflow:hidden;transition:transform .3s,border-color .3s}
.tc::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,0),color-mix(in srgb,var(--c) 30%,transparent),transparent 60%);opacity:0;transition:.3s}
.tc:hover{transform:translateY(-6px);border-color:var(--c)}.tc:hover::before{opacity:1}
.tc b{font-size:34px;color:var(--c);display:block;line-height:1;margin-bottom:10px;position:relative}
.tc small{color:var(--mut);position:relative}
.layout{display:grid;grid-template-columns:290px 1fr;max-width:1300px;margin:0 auto;min-height:80vh}
aside{border-inline-end:1px solid var(--line);padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);height:calc(100vh - 58px);height:calc(100dvh - 58px);overflow:auto}
aside input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
aside h4{margin:16px 0 4px;color:var(--vio);font-size:14px}
aside a{display:flex;justify-content:space-between;padding:5px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
aside a:hover{background:var(--line)}aside a.on{background:var(--vio);color:#fff}
aside a em{font-style:normal;color:var(--mint);font-size:12px}
main{padding:28px clamp(16px,4vw,44px) 60px;min-width:0}
main h1{font-size:clamp(30px,4vw,46px);margin:0 0 6px;letter-spacing:-.02em;animation:rise .6s both}
.crumb{color:var(--mut);margin-bottom:18px}
main p{max-width:72ch}
pre.code{background:var(--code);color:var(--codeink);padding:16px;border-radius:12px;overflow-x:auto;font:14px/1.6 "JetBrains Mono",monospace;direction:ltr;text-align:left;border-inline-start:4px solid var(--mint)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.ed>div{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.ed header{position:static;padding:8px 12px;font-weight:700;border:0;background:var(--line);backdrop-filter:none}
.ed textarea{width:100%;height:280px;border:0;padding:12px;background:var(--code);color:var(--codeink);font:14px/1.5 "JetBrains Mono",monospace;resize:vertical;direction:ltr;text-align:left;display:block}
.ed iframe{width:100%;height:280px;border:0;background:#fff;display:block}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:30px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vio),var(--mint));transition:width .5s}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:none;color:var(--ink);font:inherit;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--vio);transform:translateX(4px)}
.opt.ok{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 18%,transparent);animation:pop .3s}
.opt.no{border-color:#ee4466;background:#ee446622;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.quiz input{width:110px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:0 8px}.quiz h2{margin:14px 0 0;color:var(--mint)}
.note{background:color-mix(in srgb,var(--amb) 16%,transparent);border-inline-start:4px solid var(--amb);padding:12px 16px;border-radius:10px}
@media(max-width:860px){.hero,.ed{grid-template-columns:1fr}.layout{grid-template-columns:1fr}aside{position:static;height:auto;max-height:260px;border:0;border-block-end:1px solid var(--line)}}
.cm{display:flex;height:300px;background:var(--code);overflow:hidden}
.cm pre{margin:0;font:14px/1.5 "JetBrains Mono",monospace;white-space:pre;tab-size:2;direction:ltr;text-align:left}
#ln{padding:12px 8px 12px 10px;min-width:42px;text-align:right!important;color:#6b72b3;overflow:hidden;user-select:none;border-inline-end:1px solid #ffffff1a}
.cw{position:relative;flex:1;min-width:0}
.cw pre,.cw textarea{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:12px;border:0;font:14px/1.5 "JetBrains Mono",monospace;white-space:pre;tab-size:2;direction:ltr;text-align:left;overflow:auto}
.cw pre{overflow:hidden;pointer-events:none;color:var(--codeink)}
.ed .cw textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;display:block;height:100%}
.cw textarea::selection{background:#5b3df566}
.cw i{font-style:normal}.cw .k{color:#c792ea}.cw .s{color:#c3e88d}.cw .c{color:#7d84c4;font-style:italic}.cw .n{color:#f78c6c}.cw .t{color:#82aaff}.cw .a{color:#ffcb6b}
#pb{padding:6px 12px;max-height:84px;overflow:auto;font:13px/1.6 "JetBrains Mono",monospace;background:var(--card);border-block-start:1px solid var(--line);direction:ltr;text-align:left}
#pb a{display:block;cursor:pointer}.pw{color:#b8860b}.pe{color:#d4294f}.po{color:var(--mint)}
#sb{padding:3px 12px;font:12px monospace;color:var(--mut);background:var(--card);border-block-start:1px solid var(--line);direction:ltr;text-align:right}
.ed iframe{height:440px}.sm{padding:3px 10px;font-size:13px}.auto{font-size:13px;font-weight:600;display:flex;gap:4px;align-items:center;cursor:pointer}
h1,h2,h3,.logo,.tc b{font-family:"Space Grotesk","Inter",system-ui,sans-serif}
html[lang=fa] :is(h1,h2,h3,.logo,.tc b){font-family:"Vazirmatn",system-ui,sans-serif}
:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
#bg,#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
#fx{background:radial-gradient(640px circle at var(--mx,50%) var(--my,25%),color-mix(in srgb,var(--vio) 14%,transparent),transparent 62%)}
#fx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(color-mix(in srgb,var(--vio) 30%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--vio) 30%,transparent) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(280px circle at var(--mx,50%) var(--my,25%),#000,transparent);mask-image:radial-gradient(280px circle at var(--mx,50%) var(--my,25%),#000,transparent)}
#app,.credit{position:relative;z-index:1}
#ring,#dot{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:100;opacity:0}
#ring{width:34px;height:34px;border:1.5px solid var(--vio);transition:width .2s,height .2s,background .2s,opacity .3s}

H("HTML HOME","خانهٔ HTML","Welcome! HTML is the first step to building web pages. Follow the lessons in order, edit every example, and press Run to see the result.","خوش آمدی! HTML اولین قدم ساخت صفحهٔ وب است. درس‌ها را به ترتیب بخوان، هر مثال را ویرایش کن و با Run نتیجه را ببین.",'<h1>Hello, web!</h1>\n<p>Edit me and press Run.</p>');
H("HTML Editors","ویرایشگرهای HTML","Any text editor works. VS Code is a popular free choice. Save the file with the .html extension and open it in a browser.","هر ویرایشگر متنی کافی است. VS Code انتخاب رایگان و محبوبی است. فایل را با پسوند .html ذخیره کن و در مرورگر باز کن.",'<h1>Saved as index.html</h1>');
H("HTML Basic","مبانی HTML","Every page starts with <!DOCTYPE html>, then <html> containing a <head> (settings) and a <body> (visible content).","هر صفحه با <!DOCTYPE html> شروع می‌شود، سپس html که شامل head (تنظیمات) و body (محتوای قابل‌مشاهده) است.",'<!DOCTYPE html>\n<html lang="en">\n<head><title>Basic</title></head>\n<body><h1>Body content</h1></body>\n</html>');
H("HTML Styles","استایل‌ها","The style attribute adds CSS directly to one element, for example color, background-color, font-size and text-align.","ویژگی style مستقیم به یک المان CSS می‌دهد؛ مثلاً color، background-color، font-size و text-align.",'<h1 style="color:tomato;text-align:center">Styled</h1>\n<p style="background:#eef;font-size:20px">Inline styles</p>');
H("HTML Formatting","قالب‌بندی متن","Use <strong> and <em> for important and emphasized text. Also: <mark>, <small>, <del>, <ins>, <sub>, <sup>.","برای متن مهم و تأکیدی از strong و em استفاده کن. همچنین: mark، small، del، ins، sub و sup.",'<p><strong>Strong</strong>, <em>emphasis</em>, <mark>marked</mark>, <del>deleted</del>, <ins>inserted</ins>, H<sub>2</sub>O, x<sup>2</sup></p>');
H("HTML Quotations","نقل‌قول‌ها","<blockquote> is a long quotation, <q> a short inline one, <cite> names the work, and <abbr> explains an abbreviation.","blockquote برای نقل‌قول بلند، q برای نقل‌قول کوتاه درون‌خطی، cite برای نام اثر و abbr برای توضیح مخفف است.",'<blockquote>Learning never exhausts the mind.</blockquote>\n<p>She said <q>start small</q>.</p>\n<p><abbr title="HyperText Markup Language">HTML</abbr></p>');
H("HTML Comments","کامنت‌ها","Comments are ignored by the browser. Use them for notes or to temporarily disable code.","مرورگر کامنت‌ها را نادیده می‌گیرد. برای یادداشت یا غیرفعال‌کردن موقت کد از آن‌ها استفاده کن.",'<!\x2d\x2d This is a comment \x2d\x2d>\n<p>Visible paragraph</p>\n<!\x2d\x2d <p>Hidden paragraph</p> \x2d\x2d>');
H("HTML Colors","رنگ‌ها","Colors can be names, HEX, RGB or HSL. Use background-color for backgrounds and color for text.","رنگ را می‌توان با نام، HEX، RGB یا HSL نوشت. background-color برای پس‌زمینه و color برای متن است.",'<p style="background:tomato;color:white">Name</p>\n<p style="background:#5b3df5;color:white">HEX</p>\n<p style="background:rgb(15,169,127);color:white">RGB</p>\n<p style="background:hsl(40 100% 50%)">HSL</p>');
H("HTML CSS","HTML و CSS","CSS can be inline (style attribute), internal (<style> in the head) or external (a .css file linked with <link>). External is best for real sites.","CSS می‌تواند درون‌خطی (ویژگی style)، داخلی (تگ style در head) یا خارجی (فایل css با link) باشد. برای سایت واقعی خارجی بهترین است.",'<style>\nbody{font-family:sans-serif}\nh1{color:#5b3df5}\n</style>\n<h1>Internal CSS</h1>');
H("HTML Project","پروژهٔ HTML","Practice project: build a small profile page with a heading, a photo, a short bio, a list of skills and a link.","پروژهٔ تمرینی: یک صفحهٔ پروفایل کوچک با عنوان، تصویر، توضیح کوتاه، فهرست مهارت‌ها و لینک بساز.",'<h1>Sara Ahmadi</h1>\n<p>Front-end learner.</p>\n<h2>Skills</h2>\n<ul><li>HTML</li><li>CSS</li></ul>\n<a href="#">Contact me</a>');
H("HTML Favicon","فاوآیکون","A favicon is the small icon in the browser tab. Add it with <link rel=\"icon\"> inside <head>.","فاوآیکون آیکن کوچک تب مرورگر است. با link rel=\"icon\" داخل head اضافه می‌شود.",'<head>\n<link rel="icon" href="favicon.ico">\n</head>\n<p>The icon goes in the head of your page.</p>');
H("HTML Page Title","عنوان صفحه","The <title> element sets the text shown in the browser tab and in search results. Keep it short and descriptive.","المان title متن تب مرورگر و نتایج جستجو را تعیین می‌کند. کوتاه و گویا بنویس.",'<head><title>My Page Title</title></head>\n<body><p>Look at the browser tab.</p></body>');
H("HTML Block & Inline","بلوکی و درون‌خطی","Block elements (div, p, h1) start on a new line and take the full width. Inline elements (span, a, b) only take the space they need.","المان‌های بلوکی (div، p، h1) در خط جدید می‌آیند و تمام عرض را می‌گیرند. المان‌های درون‌خطی (span، a، b) فقط به اندازهٔ خودشان جا می‌گیرند.",'<div style="background:#fdd">block</div>\n<span style="background:#dfd">inline</span> <span style="background:#ddf">inline</span>');
H("HTML Div","المان div","<div> is a generic container used to group elements for styling or layout.","div یک ظرف عمومی برای گروه‌بندی المان‌ها جهت استایل و چیدمان است.",'<div style="border:2px solid #5b3df5;padding:12px">\n  <h3>Card title</h3>\n  <p>Grouped inside a div.</p>\n</div>');
H("HTML Classes","کلاس‌ها","The class attribute names a group of elements so one CSS rule can style them all. An element can have several classes.","ویژگی class به گروهی از المان‌ها نام می‌دهد تا یک قانون CSS همه را استایل کند. یک المان می‌تواند چند کلاس داشته باشد.",'<style>.note{background:#fff3cd;padding:8px}.big{font-size:22px}</style>\n<p class="note">Note</p>\n<p class="note big">Big note</p>');
H("HTML Id","شناسه (id)","The id attribute gives one element a unique name. Use it for links to a section (#top) and in JavaScript.","ویژگی id به یک المان نام یکتا می‌دهد. برای لینک به بخش‌ها (#top) و در جاوااسکریپت به کار می‌رود.",'<a href="#end">Jump to the end</a>\n<div style="height:300px">Scroll area</div>\n<h2 id="end">The end</h2>');
H("HTML Buttons","دکمه‌ها","Use <button> for clickable actions. Set type to button, submit or reset, and add behavior with onclick or JavaScript.","برای عمل‌های قابل‌کلیک از button استفاده کن. type را button، submit یا reset بگذار و رفتار را با onclick یا جاوااسکریپت بده.",'<button onclick="this.textContent=\'Clicked!\'">Click me</button>');
H("HTML Iframes","آی‌فریم‌ها","An <iframe> embeds another page inside the current one. Always give it a title for accessibility.","iframe صفحه‌ای دیگر را درون صفحهٔ فعلی نمایش می‌دهد. برای دسترس‌پذیری حتماً title بده.",'<iframe title="Inner page" width="300" height="120" srcdoc="<h3>Hello from inside</h3>"></iframe>');
H("HTML JavaScript","HTML و جاوااسکریپت","Add JavaScript with the <script> element. It can change the page after it loads.","جاوااسکریپت با المان script اضافه می‌شود و می‌تواند صفحه را بعد از بارگذاری تغییر دهد.",'<p id="demo">Before</p>\n<script>\ndocument.getElementById("demo").textContent = "After, set by JavaScript";\n<\/script>');
H("HTML File Paths","مسیر فایل‌ها","A path tells the browser where a file is: \"pic.jpg\" (same folder), \"images/pic.jpg\" (subfolder), \"../pic.jpg\" (parent folder) or a full URL.","مسیر به مرورگر می‌گوید فایل کجاست: pic.jpg (همان پوشه)، images/pic.jpg (زیرپوشه)، ../pic.jpg (پوشهٔ بالاتر) یا URL کامل.",'<p>Examples:</p>\n<pre>&lt;img src="pic.jpg"&gt;\n&lt;img src="images/pic.jpg"&gt;\n&lt;img src="../pic.jpg"&gt;</pre>');
H("HTML Head","بخش head","The <head> holds information about the page: <title>, <meta>, <link> and <style>. None of it is shown directly.","head اطلاعات صفحه را نگه می‌دارد: title، meta، link و style. هیچ‌کدام مستقیم نمایش داده نمی‌شوند.",'<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Head demo</title>\n</head>\n<body><p>Body</p></body>');
H("HTML Layout","چیدمان صفحه","Typical layout: header, nav, main (with section and aside) and footer. CSS Grid or Flexbox arranges them.","چیدمان معمول: header، nav، main (با section و aside) و footer. CSS Grid یا Flexbox آن‌ها را می‌چیند.",'<style>\n.l{display:grid;grid-template-columns:1fr 3fr;gap:6px}\n.l>*{background:#eef;padding:10px}\nheader,footer{grid-column:1/-1}\n</style>\n<div class="l"><header>Header</header><nav>Nav</nav><main>Main</main><footer>Footer</footer></div>');
H("HTML Responsive","طراحی واکنش‌گرا","Responsive pages fit every screen. Add the viewport meta tag, use flexible widths (max-width:100%) and CSS media queries.","صفحهٔ واکنش‌گرا با هر صفحه‌نمایشی جور می‌شود. متای viewport را اضافه کن، از عرض‌های انعطاف‌پذیر (max-width:100%) و مدیا کوئری استفاده کن.",'<meta name="viewport" content="width=device-width, initial-scale=1">\n<style>img{max-width:100%}.b{display:flex;flex-wrap:wrap;gap:8px}.b div{flex:1 1 140px;background:#dfd;padding:14px}</style>\n<div class="b"><div>One</div><div>Two</div><div>Three</div></div>');
H("HTML Computercode","کد کامپیوتری","Use <code> for code, <kbd> for keys, <samp> for program output and <var> for variables. Wrap blocks in <pre> to keep the spacing.","برای کد از code، برای کلید از kbd، برای خروجی برنامه از samp و برای متغیر از var استفاده کن. بلوک‌ها را داخل pre بگذار تا فاصله‌ها حفظ شود.",'<p>Press <kbd>Ctrl</kbd>+<kbd>S</kbd> to save.</p>\n<p>Variable: <var>x</var>, output: <samp>OK</samp></p>\n<pre><code>let x = 5;\nconsole.log(x);</code></pre>');
H("HTML Semantics","المان‌های معنایی","Semantic elements describe their meaning: header, nav, main, section, article, aside, footer, figure. They help search engines and screen readers.","المان‌های معنایی معنی خود را بیان می‌کنند: header، nav، main، section، article، aside، footer و figure. به موتورهای جستجو و صفحه‌خوان‌ها کمک می‌کنند.",'<article>\n  <header><h2>Post title</h2></header>\n  <p>Post text.</p>\n  <footer>By Sara</footer>\n</article>');
H("HTML Style Guide","راهنمای سبک نوشتن","Good habits: declare <!DOCTYPE html>, use lowercase tags, quote attribute values, always add alt on images, indent nested code and close every element.","عادت‌های خوب: <!DOCTYPE html> بنویس، تگ‌ها را با حروف کوچک بنویس، مقدار ویژگی‌ها را در گیومه بگذار، برای تصاویر alt بده، کد تودرتو را تورفتگی بده و هر المان را ببند.",'<!DOCTYPE html>\n<html lang="en">\n<head><meta charset="UTF-8"><title>Clean</title></head>\n<body>\n  <img src="" alt="Describe the image">\n</body>\n</html>');
H("HTML Entities","موجودیت‌ها","Reserved characters must be written as entities: &lt; for <, &gt; for >, &amp; for & and &nbsp; for a non-breaking space.","نویسه‌های رزرو باید به شکل موجودیت نوشته شوند: &lt; برای <، &gt; برای >، &amp; برای & و &nbsp; برای فاصلهٔ شکسته‌نشدنی.",'<p>5 &lt; 10 &amp; 10 &gt; 5</p>\n<p>Copyright &copy; 2026, price &euro;20</p>');
H("HTML Symbols","نمادها","Symbols that are not on your keyboard can be added by entity name or number, such as &hearts;, &check; or &#9733;.","نمادهایی که روی کیبورد نیستند را می‌توان با نام یا شمارهٔ موجودیت اضافه کرد، مثل &hearts;، &check; یا &#9733;.",'<p>&hearts; &check; &#9733; &rarr; &infin; &deg; &pound;</p>');
H("HTML Emojis","ایموجی‌ها","Emojis are characters, so they work like any text once the page uses UTF-8. You can also use their numeric code.","ایموجی‌ها نویسه‌اند و وقتی صفحه UTF-8 باشد مثل هر متن کار می‌کنند. می‌توانی از کد عددی‌شان هم استفاده کنی.",'<meta charset="UTF-8">\n<h1 style="font-size:50px">&#128512; 🚀 ✨</h1>');
H("HTML Charsets","مجموعه نویسه‌ها","A charset tells the browser how to read the file. Use UTF-8 with <meta charset=\"UTF-8\">; it supports every language, including Persian.","charset به مرورگر می‌گوید فایل را چگونه بخواند. با meta charset=\"UTF-8\" از UTF-8 استفاده کن؛ همهٔ زبان‌ها از جمله فارسی را پشتیبانی می‌کند.",'<meta charset="UTF-8">\n<p>English · فارسی · العربية · 中文</p>');
H("HTML URL Encode","رمزگذاری URL","URLs can only contain safe ASCII characters, so others are encoded as %XX (a space becomes %20). JavaScript does it with encodeURIComponent().","URL فقط نویسه‌های امن ASCII دارد، پس بقیه به شکل %XX کدگذاری می‌شوند (فاصله می‌شود %20). جاوااسکریپت این کار را با encodeURIComponent() می‌کند.",'<p id="o"></p>\n<script>\no.textContent = encodeURIComponent("hello world & سلام");\n<\/script>');
H("HTML vs. XHTML","HTML در برابر XHTML","XHTML is a stricter, XML-based version: lowercase tags, every element closed, quoted attributes. Modern HTML5 is more forgiving but follows the same good habits.","XHTML نسخهٔ سخت‌گیرتر مبتنی بر XML است: تگ‌های کوچک، بستن همهٔ المان‌ها و گیومهٔ ویژگی‌ها. HTML5 مدرن آسان‌گیرتر است ولی همین عادت‌های خوب را دارد.",'<br />\n<img src="" alt="xhtml style" />\n<p>Self-closing tags are valid in both.</p>');
H("HTML Form Attributes","ویژگی‌های فرم","Key <form> attributes: action (where to send), method (get or post), target, autocomplete and novalidate.","ویژگی‌های مهم form: action (مقصد ارسال)، method (get یا post)، target، autocomplete و novalidate.",'<form action="/save" method="post" autocomplete="off">\n  <input name="q" placeholder="Search">\n  <button>Send</button>\n</form>');
H("HTML Form Elements","المان‌های فرم","Besides <input> there are <select> with <option>, <textarea>, <button>, <fieldset> with <legend>, and <datalist> for suggestions.","جز input، المان‌های select با option، textarea، button، fieldset با legend و datalist برای پیشنهاد هم هست.",'<form>\n <select><option>HTML</option><option>CSS</option></select>\n <textarea placeholder="Message"></textarea>\n <fieldset><legend>Level</legend><label><input type="radio" name="l"> Beginner</label></fieldset>\n</form>');
H("HTML Input Types","انواع input","The type attribute changes the control: text, password, email, number, date, color, range, checkbox, radio, file and more.","ویژگی type کنترل را عوض می‌کند: text، password، email، number، date، color، range، checkbox، radio، file و غیره.",'<p><input type="email" placeholder="Email"></p>\n<p><input type="number" min="1" max="10"></p>\n<p><input type="date"></p>\n<p><input type="color"></p>\n<p><input type="range"></p>');
H("HTML Input Attributes","ویژگی‌های input","Useful attributes: value, placeholder, required, readonly, disabled, min, max, maxlength and pattern.","ویژگی‌های کاربردی: value، placeholder، required، readonly، disabled، min، max، maxlength و pattern.",'<form>\n <input required placeholder="Required" maxlength="10">\n <input value="Read only" readonly>\n <input pattern="[0-9]{4}" placeholder="4 digits">\n <button>Check</button>\n</form>');
H("Input Form Attributes","ویژگی‌های فرمی input","Inputs can override the form: formaction, formmethod and formtarget let a single button send the data somewhere else.","inputها می‌توانند فرم را بازنویسی کنند: formaction، formmethod و formtarget به یک دکمه اجازه می‌دهند داده را جای دیگری بفرستد.",'<form action="/a">\n <input name="x">\n <button>Default</button>\n <button formaction="/b" formmethod="post">Other action</button>\n</form>');
H("HTML Canvas","بوم (Canvas)","<canvas> is a drawing surface controlled by JavaScript. Get a 2D context, then draw shapes and text.","canvas بومی برای نقاشی با جاوااسکریپت است. context دوبعدی را بگیر و شکل و متن بکش.",'<canvas id="c" width="260" height="120" style="border:1px solid #999"></canvas>\n<script>\nconst x = document.getElementById("c").getContext("2d");\nx.fillStyle = "#5b3df5"; x.fillRect(20, 20, 100, 60);\nx.fillStyle = "#0fa97f"; x.beginPath(); x.arc(190, 60, 36, 0, 7); x.fill();\n<\/script>');
H("HTML SVG","گرافیک SVG","SVG draws scalable vector graphics with XML tags, so shapes stay sharp at any size. It lives directly in HTML.","SVG گرافیک برداری مقیاس‌پذیر را با تگ‌های XML می‌کشد و در هر اندازه‌ای شفاف می‌ماند. مستقیم در HTML قرار می‌گیرد.",'<svg width="220" height="110">\n <rect x="10" y="10" width="90" height="60" fill="tomato"/>\n <circle cx="160" cy="50" r="36" fill="#5b3df5"/>\n <text x="10" y="100">SVG</text>\n</svg>');
H("HTML Media","چندرسانه‌ای","HTML can embed video, audio and other media with built-in elements, no plug-ins needed. Always offer controls and a text fallback.","HTML بدون افزونه ویدیو، صدا و رسانه‌های دیگر را با المان‌های داخلی نمایش می‌دهد. همیشه کنترل‌ها و متن جایگزین بگذار.",'<video controls width="260"><source src="movie.mp4" type="video/mp4">Your browser does not support video.</video>');
H("HTML Video","ویدیو","Use <video> with controls. Add width, autoplay (with muted), loop and poster. List several <source> files for browser support.","از video همراه با controls استفاده کن. width، autoplay (با muted)، loop و poster را اضافه کن. چند source برای پشتیبانی مرورگرها بگذار.",'<video controls width="300" poster="">\n <source src="movie.mp4" type="video/mp4">\n <source src="movie.webm" type="video/webm">\n Not supported.\n</video>');
H("HTML Audio","صدا","Use <audio controls> with one or more <source> files (mp3, ogg, wav). Add loop or autoplay when needed.","از audio با controls و یک یا چند source (mp3، ogg، wav) استفاده کن. در صورت نیاز loop یا autoplay اضافه کن.",'<audio controls>\n <source src="song.mp3" type="audio/mpeg">\n Your browser does not support audio.\n</audio>');
H("HTML Plug-ins","افزونه‌ها","Plug-ins like Flash are obsolete. Today use <video>, <audio>, <iframe> or <embed> (for PDFs) instead.","افزونه‌هایی مثل فلش منسوخ شده‌اند. امروز به‌جایش از video، audio، iframe یا embed (برای PDF) استفاده کن.",'<embed src="file.pdf" type="application/pdf" width="300" height="120">\n<p>Use embed or object for PDFs.</p>');
H("HTML YouTube","ویدیوی یوتیوب","To embed a YouTube video, open Share → Embed and paste the <iframe>. Set a title and allowfullscreen.","برای جاسازی ویدیوی یوتیوب، Share ← Embed را باز کن و iframe را بچسبان. title و allowfullscreen را بگذار.",'<iframe width="300" height="170" title="YouTube video"\n src="https://www.youtube.com/embed/VIDEO_ID" allowfullscreen></iframe>');
H("Web APIs","وب API","Web APIs are browser features exposed to JavaScript, such as geolocation, storage, drag and drop and workers. Always check that the API exists first.","وب API ها امکانات مرورگر برای جاوااسکریپت‌اند، مثل موقعیت مکانی، ذخیره‌سازی، کشیدن و رها کردن و workerها. همیشه اول وجود API را بررسی کن.",'<p id="o"></p>\n<script>\no.textContent = "geolocation: " + ("geolocation" in navigator) + ", workers: " + ("Worker" in window);\n<\/script>');
H("Geolocation API","API موقعیت مکانی","navigator.geolocation.getCurrentPosition() asks the user for permission, then returns latitude and longitude. Handle errors, because users can say no.","navigator.geolocation.getCurrentPosition() از کاربر اجازه می‌گیرد و سپس عرض و طول جغرافیایی را می‌دهد. خطا را مدیریت کن چون کاربر ممکن است رد کند.",'<button onclick="go()">Get location</button><p id="o"></p>\n<script>\nfunction go(){\n navigator.geolocation.getCurrentPosition(\n  p => o.textContent = p.coords.latitude + ", " + p.coords.longitude,\n  e => o.textContent = "Error: " + e.message);\n}\n<\/script>');
H("Drag and Drop API","API کشیدن و رها کردن","Set draggable=\"true\", store data in dragstart, call preventDefault() in dragover and read the data in drop.","draggable=\"true\" بگذار، در dragstart داده را ذخیره کن، در dragover تابع preventDefault() را صدا بزن و در drop داده را بخوان.",'<div id="a" draggable="true" style="background:#5b3df5;color:#fff;padding:10px;width:90px">Drag me</div>\n<div id="b" style="border:2px dashed #999;height:80px;margin-top:10px">Drop here</div>\n<script>\na.ondragstart = e => e.dataTransfer.setData("t", "a");\nb.ondragover = e => e.preventDefault();\nb.ondrop = e => { e.preventDefault(); b.append(a); };\n<\/script>');
H("Popover API","API پاپ‌اور","The popover attribute shows a floating layer with no JavaScript. Link a button to it with popovertarget.","ویژگی popover بدون جاوااسکریپت یک لایهٔ شناور نشان می‌دهد. دکمه را با popovertarget به آن وصل کن.",'<button popovertarget="p">Open</button>\n<div id="p" popover style="padding:16px">Hello from a popover! Click outside to close.</div>');
H("Web Storage API","API ذخیره‌سازی وب","localStorage keeps data in the browser with no expiry; sessionStorage lasts until the tab closes. Both store strings only.","localStorage داده را بدون انقضا در مرورگر نگه می‌دارد؛ sessionStorage تا بستن تب می‌ماند. هر دو فقط رشته ذخیره می‌کنند.",'<p id="o"></p>\n<script>\ntry {\n  let n = +(localStorage.getItem("visits") || 0) + 1;\n  localStorage.setItem("visits", n);\n  o.textContent = "Runs so far: " + n;\n} catch (e) { o.textContent = "Storage blocked here."; }\n<\/script>');
H("Web Workers API","API وب ورکر","A Web Worker runs JavaScript in a background thread so heavy work does not freeze the page. Communicate with postMessage.","وب ورکر جاوااسکریپت را در یک ترد پس‌زمینه اجرا می‌کند تا کار سنگین صفحه را قفل نکند. ارتباط با postMessage انجام می‌شود.",'<p id="o">Working…</p>\n<script>\ntry {\n const src = "onmessage=e=>postMessage(e.data*2)";\n const w = new Worker(URL.createObjectURL(new Blob([src])));\n w.onmessage = e => o.textContent = "Worker says: " + e.data;\n w.postMessage(21);\n} catch (e) { o.textContent = "Workers are blocked here."; }\n<\/script>');
H("Server-Sent Events API","API رویدادهای ارسالی سرور","EventSource keeps a connection open so the server can push updates to the page. It is one-way, from server to browser.","EventSource اتصال را باز نگه می‌دارد تا سرور به‌روزرسانی‌ها را به صفحه بفرستد. یک‌طرفه است: از سرور به مرورگر.",'<p id="o">Needs a server endpoint.</p>\n<pre>const es = new EventSource("/updates");\nes.onmessage = e => console.log(e.data);</pre>');
H("HTML Examples","مثال‌های HTML","A quick page that combines the basics: heading, text, link, image, list and table. Change anything and run it.","یک صفحهٔ سریع که مبانی را ترکیب می‌کند: عنوان، متن، لینک، تصویر، لیست و جدول. هر چیز را تغییر بده و اجرا کن.",'<h1>Everything together</h1>\n<p>A <a href="#">link</a> and a list:</p>\n<ul><li>One</li><li>Two</li></ul>\n<table border="1"><tr><th>A</th><th>B</th></tr><tr><td>1</td><td>2</td></tr></table>');
H("HTML Editor","ویرایشگر HTML","This is your free playground. Write any HTML, press Run (or Ctrl+Enter) and experiment without limits.","این زمین بازی آزاد توست. هر HTML بنویس، Run (یا Ctrl+Enter) بزن و بدون محدودیت آزمایش کن.",'<!DOCTYPE html>\n<html>\n<body>\n\n<h1>My playground</h1>\n\n</body>\n</html>');
H("HTML Quiz","آزمون HTML","Test your knowledge with the three questions below, then move on to the next lesson.","با سه سؤال زیر دانسته‌هایت را بسنج، سپس به درس بعدی برو.",'<h2>Quiz time 🎯</h2>\n<p>Answer the questions under the editor.</p>');
H("HTML Exercises","تمرین‌های HTML","Practice what you have learned. Answer the questions below, and try the challenge in the editor.","آنچه یاد گرفتی را تمرین کن. به سؤال‌های زیر جواب بده و چالش داخل ویرایشگر را امتحان کن.",'<!\x2d\x2d Challenge: add a level-2 heading and a link \x2d\x2d>\n<h1>Exercise</h1>');
H("HTML Challenges","چالش‌های HTML","Challenge 1: build a recipe card with a title, an ingredient list and numbered steps. Challenge 2: add a table of nutrition facts.","چالش ۱: یک کارت دستور پخت با عنوان، فهرست مواد و مراحل شماره‌دار بساز. چالش ۲: جدول ارزش غذایی اضافه کن.",'<h1>Pancakes</h1>\n<h2>Ingredients</h2>\n<ul><li>Flour</li></ul>\n<h2>Steps</h2>\n<ol><li>Mix</li></ol>');
H("HTML Website","ساخت وب‌سایت","Combine everything into a real site: a header with navigation, a main section, and a footer, linked across several pages.","همه چیز را در یک سایت واقعی ترکیب کن: هدر با ناوبری، بخش اصلی و فوتر، با لینک بین چند صفحه.",'<header><nav><a href="#">Home</a> | <a href="#">About</a> | <a href="#">Contact</a></nav></header>\n<main><h1>My site</h1><p>Welcome.</p></main>\n<footer>© 2026</footer>');
H("HTML Syllabus","سرفصل‌های HTML","Study order: basics, text and links, images and tables, forms, semantics and layout, media, and web APIs.","ترتیب مطالعه: مبانی، متن و لینک، تصویر و جدول، فرم‌ها، معنایی و چیدمان، رسانه و وب API.",'<ol>\n<li>Basics</li><li>Text and links</li><li>Images and tables</li><li>Forms</li><li>Semantics and layout</li><li>Media</li><li>Web APIs</li>\n</ol>');
H("HTML Study Plan","برنامهٔ مطالعه","A simple 4-week plan: week 1 basics, week 2 forms and tables, week 3 semantics and layout, week 4 a final project.","برنامهٔ ساده چهارهفته‌ای: هفتهٔ ۱ مبانی، هفتهٔ ۲ فرم و جدول، هفتهٔ ۳ معنایی و چیدمان، هفتهٔ ۴ پروژهٔ نهایی.",'<table border="1" cellpadding="6">\n<tr><td>Week 1</td><td>Basics</td></tr>\n<tr><td>Week 2</td><td>Forms and tables</td></tr>\n<tr><td>Week 3</td><td>Semantics and layout</td></tr>\n<tr><td>Week 4</td><td>Final project</td></tr>\n</table>');
H("HTML Interview Prep","آمادگی مصاحبه","Common questions: What is semantic HTML? Difference between div and span? What does alt do? How do id and class differ? What is the DOCTYPE for?","سؤال‌های رایج: HTML معنایی چیست؟ تفاوت div و span؟ alt چه می‌کند؟ تفاوت id و class؟ DOCTYPE برای چیست؟",'<ul>\n<li>Semantic HTML = elements that describe meaning</li>\n<li>div = block, span = inline</li>\n<li>id is unique, class is reusable</li>\n</ul>');
H("HTML Summary","خلاصهٔ HTML","HTML structures content with elements and attributes. Use headings, paragraphs, links, images, lists, tables and forms, and prefer semantic tags.","HTML محتوا را با المان و ویژگی ساختار می‌دهد. از عنوان، پاراگراف، لینک، تصویر، لیست، جدول و فرم استفاده کن و تگ‌های معنایی را ترجیح بده.",'<h1>HTML in one page</h1>\n<p>Elements + attributes = structure.</p>');
H("HTML Accessibility","دسترس‌پذیری","Make pages usable for everyone: alt text on images, labels on inputs, headings in order, good color contrast and keyboard-friendly controls.","صفحه را برای همه قابل‌استفاده کن: alt برای تصاویر، label برای ورودی‌ها، عنوان‌ها به ترتیب، کنتراست رنگ خوب و کنترل‌های سازگار با کیبورد.",'<label for="n">Your name</label>\n<input id="n">\n<img src="" alt="A clear description">\n<button aria-label="Close">×</button>');
H("HTML Attributes Reference","مرجع ویژگی‌ها","Common attributes: href, src, alt, id, class, style, title, type, value, name, placeholder, required, disabled, target.","ویژگی‌های رایج: href، src، alt، id، class، style، title، type، value، name، placeholder، required، disabled و target.",'<a href="#" title="Tooltip" target="_blank">Hover me</a>');
H("HTML Global Attributes","ویژگی‌های عمومی","Global attributes work on every element: id, class, style, title, lang, dir, hidden, tabindex, contenteditable and data-*.","ویژگی‌های عمومی روی همهٔ المان‌ها کار می‌کنند: id، class، style، title، lang، dir، hidden، tabindex، contenteditable و data-*.",'<p contenteditable="true">Click and edit this text.</p>\n<p hidden>Hidden</p>\n<p lang="fa" dir="rtl">متن راست‌به‌چپ</p>');
H("HTML Browser Support","پشتیبانی مرورگرها","Most HTML5 features work in all modern browsers. Check caniuse.com or MDN compatibility tables before using a new feature, and add fallbacks.","بیشتر امکانات HTML5 در همهٔ مرورگرهای مدرن کار می‌کنند. قبل از استفاده از قابلیت جدید caniuse.com یا جدول سازگاری MDN را ببین و جایگزین بگذار.",'<p id="o"></p>\n<script>\no.textContent = "popover supported: " + ("popover" in HTMLElement.prototype);\n<\/script>');
H("HTML Event Attributes","ویژگی‌های رویداد","Event attributes run JavaScript on actions: onclick, onchange, onmouseover, onkeydown, onload, onsubmit.","ویژگی‌های رویداد هنگام عمل‌ها جاوااسکریپت اجرا می‌کنند: onclick، onchange، onmouseover، onkeydown، onload و onsubmit.",'<p onmouseover="this.style.color=\'tomato\'" onmouseout="this.style.color=\'\'">Hover me</p>\n<input onchange="alert(\'Changed!\')" placeholder="Type, then leave">');
H("HTML Doctypes","داک‌تایپ‌ها","In HTML5 the doctype is simply <!DOCTYPE html>. It must be the very first line so browsers use standards mode.","در HTML5 داک‌تایپ فقط <!DOCTYPE html> است. باید دقیقاً اولین خط باشد تا مرورگر در حالت استاندارد کار کند.",'<!DOCTYPE html>\n<html><body><p>Standards mode</p></body></html>');
H("HTML Character Sets","فهرست مجموعه‌نویسه‌ها","UTF-8 is the universal choice. Older sets include ASCII (English only) and ISO-8859-1 (Western European).","UTF-8 انتخاب همگانی است. مجموعه‌های قدیمی‌تر ASCII (فقط انگلیسی) و ISO-8859-1 (اروپای غربی) هستند.",'<meta charset="UTF-8">\n<p>é ñ ü ß · ا ب پ · 你好</p>');
H("HTML Language Codes","کدهای زبان","Set the language with lang on <html>: en, fa, ar, zh, fr, de, es. It helps screen readers pronounce text and search engines.","زبان را با lang روی html تعیین کن: en، fa، ar، zh، fr، de، es. به تلفظ صفحه‌خوان‌ها و موتورهای جستجو کمک می‌کند.",'<html lang="en">\n<p lang="fa">سلام</p>\n<p lang="fr">Bonjour</p>');
H("HTML Country Codes","کدهای کشور","Add a country to the language code for regional versions: en-US, en-GB, fa-IR, ar-SA, zh-CN, fr-CA.","برای نسخهٔ منطقه‌ای کد کشور را به کد زبان اضافه کن: en-US، en-GB، fa-IR، ar-SA، zh-CN و fr-CA.",'<p lang="en-GB">colour</p>\n<p lang="en-US">color</p>\n<p lang="fa-IR">ایران</p>');
H("HTTP Request Methods","متدهای درخواست HTTP","GET reads data, POST creates data, PUT replaces it, PATCH changes part of it and DELETE removes it.","GET داده را می‌خواند، POST داده می‌سازد، PUT آن را جایگزین می‌کند، PATCH بخشی را تغییر می‌دهد و DELETE حذفش می‌کند.",'<table border="1" cellpadding="6">\n<tr><td>GET</td><td>Read</td></tr>\n<tr><td>POST</td><td>Create</td></tr>\n<tr><td>PUT</td><td>Replace</td></tr>\n<tr><td>PATCH</td><td>Update part</td></tr>\n<tr><td>DELETE</td><td>Remove</td></tr>\n</table>');
H("Keyboard Shortcuts","میانبرهای کیبورد","Editor shortcuts on this site: Ctrl+Enter runs the code and Tab inserts two spaces. Common ones: Ctrl+C copy, Ctrl+V paste, Ctrl+Z undo, Ctrl+S save.","میانبرهای ویرایشگر این سایت: Ctrl+Enter کد را اجرا می‌کند و Tab دو فاصله می‌گذارد. رایج‌ها: Ctrl+C کپی، Ctrl+V چسباندن، Ctrl+Z بازگشت، Ctrl+S ذخیره.",'<p><kbd>Ctrl</kbd>+<kbd>Enter</kbd> Run</p>\n<p><kbd>Tab</kbd> Indent</p>\n<p><kbd>Ctrl</kbd>+<kbd>Z</kbd> Undo</p>');
const J=(k,ft,en,fa,c)=>{A("js",k,[en],c,[fa]);FAT[k]=ft};
J("JS Home","خانهٔ جاوااسکریپت","Welcome! Every example here runs in the editor: edit the code, press Run, and read the output. Start with JS Introduction and go in order.","خوش آمدی! همهٔ مثال‌ها در ویرایشگر اجرا می‌شوند: کد را عوض کن، Run بزن و خروجی را بخوان. از «مقدمه جاوااسکریپت» شروع کن و به ترتیب برو.",'console.log("Hello, JavaScript!");');
J("JS Where To","جای قرار دادن کد","JavaScript goes inside a script element in the page, or in an external .js file loaded with the src attribute. Put scripts at the end of the body or add defer so the page loads first.","جاوااسکریپت داخل المان script در صفحه یا در فایل جدای .js با ویژگی src قرار می‌گیرد. script را انتهای body بگذار یا defer بده تا اول صفحه بارگذاری شود.",'// External file: script src="app.js" defer\nconsole.log("Running from the editor script");\ndocument.body.append("Added by JavaScript");');
J("JS Operators","عملگرها","Arithmetic (+ - * / % **), comparison (=== !== < >), logical (&& || !), plus ?? (default for null) and ?. (safe property access).","حسابی (+ - * / % **)، مقایسه‌ای (=== !== < >)، منطقی (&& || !)، همچنین ?? (مقدار پیش‌فرض برای null) و ?. (دسترسی امن به ویژگی).",'console.log(7 % 3, 2 ** 5);\nconsole.log(5 === "5", 5 == "5");\nconsole.log(true && false, true || false);\nconst u = null;\nconsole.log(u ?? "default", u?.name);');
J("JS Strings","رشته‌ها","Strings hold text. Template literals use backticks and ${} to insert values. Handy methods: length, slice, includes, replace, split, toUpperCase, trim.","رشته متن نگه می‌دارد. رشته‌های قالبی از بک‌تیک و ${} برای جایگذاری مقدار استفاده می‌کنند. متدها: length، slice، includes، replace، split، toUpperCase و trim.",'const name = "Sara";\nconsole.log(`Hello, ${name}!`);\nconst s = "  JavaScript  ";\nconsole.log(s.trim().length, s.trim().slice(0, 4));\nconsole.log("a,b,c".split(","), s.includes("Script"));');
J("JS Numbers","اعداد","JavaScript has one number type for integers and decimals. Beware of floating-point rounding (0.1 + 0.2) and NaN. Use toFixed, parseInt and parseFloat.","جاوااسکریپت یک نوع عدد برای صحیح و اعشاری دارد. مراقب گرد شدن اعداد اعشاری (0.1 + 0.2) و NaN باش. از toFixed، parseInt و parseFloat استفاده کن.",'console.log(0.1 + 0.2);\nconsole.log((0.1 + 0.2).toFixed(2));\nconsole.log(parseInt("42px"), parseFloat("3.14abc"));\nconsole.log(Number("abc"), Number.isInteger(5));');
J("JS Timers","تایمرها","setTimeout runs code once after a delay; setInterval repeats it. Stop a timer with clearTimeout or clearInterval.","setTimeout کد را یک‌بار بعد از تأخیر اجرا می‌کند؛ setInterval تکرارش می‌کند. تایمر را با clearTimeout یا clearInterval متوقف کن.",'setTimeout(() => console.log("After 1 second"), 1000);\nlet n = 0;\nconst id = setInterval(() => {\n  console.log("tick", ++n);\n  if (n === 3) clearInterval(id);\n}, 500);');
J("JS Scope","دامنه (Scope)","let and const are block scoped; var is function scoped. A closure is a function that remembers the variables around it.","let و const بلوکی‌اند؛ var تابعی است. کلاژر تابعی است که متغیرهای اطرافش را یادش می‌ماند.",'{\n  let inner = "block";\n  var leaky = "function";\n}\nconsole.log(typeof inner, leaky);\nfunction counter() { let c = 0; return () => ++c; }\nconst next = counter();\nconsole.log(next(), next(), next());');
J("JS Dates","تاریخ","Create dates with new Date(). Read parts with getFullYear, getMonth (0-11) and getDate; format with toLocaleDateString.","با new Date() تاریخ بساز. بخش‌ها را با getFullYear، getMonth (۰ تا ۱۱) و getDate بخوان و با toLocaleDateString قالب‌بندی کن.",'const d = new Date(2026, 0, 15);\nconsole.log(d.getFullYear(), d.getMonth(), d.getDate());\nconsole.log(d.toLocaleDateString("en-US", { dateStyle: "long" }));\nconsole.log(d.toLocaleDateString("fa-IR"));');
J("JS Sets","مجموعه‌ها (Set)","A Set stores unique values. Use add, has, delete and size; it is a quick way to remove duplicates from an array.","Set مقدارهای منحصربه‌فرد نگه می‌دارد. از add، has، delete و size استفاده کن؛ راه سریع حذف تکراری‌هاست.",'const s = new Set([1, 2, 2, 3]);\ns.add(4);\nconsole.log(s.size, s.has(2));\nconsole.log([...new Set(["a", "b", "a"])]);');
J("JS Maps","نقشه‌ها (Map)","A Map holds key-value pairs where keys can be any type. Use set, get, has, delete and iterate with for...of.","Map جفت‌های کلید-مقدار نگه می‌دارد و کلید می‌تواند هر نوعی باشد. از set، get، has، delete استفاده کن و با for...of پیمایش کن.",'const m = new Map();\nm.set("html", 1).set("css", 2);\nconsole.log(m.get("css"), m.has("js"));\nfor (const [k, v] of m) console.log(k, v);');
J("JS Iterations","تکرارپذیری","Iterables work with for...of and spread. Arrays, strings, Sets and Maps are iterable. for...in loops over object keys.","اشیای تکرارپذیر با for...of و spread کار می‌کنند. آرایه، رشته، Set و Map تکرارپذیرند. for...in روی کلیدهای آبجکت حرکت می‌کند.",'for (const ch of "JS") console.log(ch);\nconst o = { a: 1, b: 2 };\nfor (const k in o) console.log(k, o[k]);\n[10, 20].forEach((v, i) => console.log(i, v));\nconsole.log(Object.entries(o));');
J("JS Math","ریاضی (Math)","The Math object has constants and helpers: Math.round, floor, ceil, max, min, random, sqrt and PI.","آبجکت Math ثابت‌ها و توابع کمکی دارد: round، floor، ceil، max، min، random، sqrt و PI.",'console.log(Math.round(4.6), Math.floor(4.9), Math.ceil(4.1));\nconsole.log(Math.max(3, 9, 5), Math.sqrt(81), Math.PI);\nconsole.log(Math.floor(Math.random() * 10) + 1);');
J("JS RegExp","عبارت منظم","Regular expressions match text patterns. Use test() for yes/no, match() or matchAll() to extract and replace() to rewrite.","عبارت منظم الگوهای متن را مطابقت می‌دهد. test() برای بله/خیر، match() یا matchAll() برای استخراج و replace() برای بازنویسی.",'const email = /^[^@\\s]+@[^@\\s]+\\.[a-z]{2,}$/i;\nconsole.log(email.test("sara@example.com"), email.test("bad@"));\nconsole.log("a1b22c333".match(/\\d+/g));\nconsole.log("2026-01-15".replace(/(\\d+)-(\\d+)-(\\d+)/, "$3/$2/$1"));');
J("JS Data Types","انواع داده","Primitive types: string, number, boolean, null, undefined, bigint and symbol. Everything else, including arrays and functions, is an object. Check with typeof.","انواع اولیه: string، number، boolean، null، undefined، bigint و symbol. بقیه‌شان از جمله آرایه و تابع آبجکت‌اند. با typeof بررسی کن.",'console.log(typeof "a", typeof 1, typeof true);\nconsole.log(typeof undefined, typeof null, typeof 10n);\nconsole.log(typeof [], Array.isArray([]), typeof (() => 1));');
J("JS Errors","خطاها","Use try...catch to handle errors without crashing, finally to always clean up, and throw to raise your own errors.","با try...catch خطا را بدون کرش مدیریت کن، با finally همیشه پاکسازی کن و با throw خطای خودت را به‌وجود بیاور.",'function div(a, b) {\n  if (b === 0) throw new Error("Cannot divide by zero");\n  return a / b;\n}\ntry { console.log(div(6, 3)); console.log(div(1, 0)); }\ncatch (e) { console.log("Caught:", e.message); }\nfinally { console.log("Done"); }');
J("JS Debugging","اشکال‌زدایی","Open DevTools (F12). Use console.log, console.table and console.error to inspect values, the debugger statement to pause, and breakpoints in the Sources panel.","DevTools را باز کن (F12). با console.log، console.table و console.error مقدارها را بررسی کن، با debugger متوقف کن و در پنل Sources بریک‌پوینت بگذار.",'const rows = [{ id: 1, name: "A" }, { id: 2, name: "B" }];\nconsole.log(JSON.stringify(rows));\nconsole.log("Labelled:", rows.length);\n// Open DevTools with F12 to use console.table(rows) and debugger');
J("JS Style Guide","راهنمای سبک کد","Use const by default, camelCase names, descriptive variable names, === for comparison, semicolons consistently, and small functions that do one job.","به‌صورت پیش‌فرض const، نام‌گذاری camelCase، نام‌های گویا، === برای مقایسه، سمی‌کالن یکدست و توابع کوچک که یک کار می‌کنند.",'// Hard to read\nconst x=(a,b)=>a*b*1.09;\n// Clear\nconst TAX_RATE = 1.09;\nconst priceWithTax = (price, qty) => price * qty * TAX_RATE;\nconsole.log(priceWithTax(10, 3));');
J("JS Reference","مرجع جاوااسکریپت","Handy built-ins: Array (map, filter, find, sort), String (slice, split, replace), Object (keys, entries, assign), Math, JSON, Date, Promise.","ابزارهای داخلی کاربردی: Array (map، filter، find، sort)، String (slice، split، replace)، Object (keys، entries، assign)، Math، JSON، Date و Promise.",'console.log([3, 1, 2].sort(), [1, 2, 3].find(x => x > 1));\nconsole.log(Object.assign({ a: 1 }, { b: 2 }));\nconsole.log(Object.getOwnPropertyNames(Math).slice(0, 8));');
J("JS Projects","پروژه‌ها","Practice project: a tiny to-do list. Type a task, press Add, and click a task to mark it done. Try adding a delete button.","پروژهٔ تمرینی: یک لیست کارهای کوچک. یک کار بنویس، Add را بزن و روی کار کلیک کن تا انجام‌شده شود. دکمهٔ حذف هم اضافه کن.",'document.body.innerHTML = "<input id=t placeholder=Task> <button id=a>Add</button><ul id=l></ul>";\nconst t = document.getElementById("t"), l = document.getElementById("l");\ndocument.getElementById("a").onclick = () => {\n  if (!t.value.trim()) return;\n  const li = document.createElement("li");\n  li.textContent = t.value;\n  li.onclick = () => li.style.textDecoration = "line-through";\n  l.append(li); t.value = "";\n};');
J("JS Versions","نسخه‌های جاوااسکریپت","JavaScript follows the ECMAScript standard. ES5 (2009) was the long-time baseline, ES6/ES2015 added let, const, classes and arrows, and a new edition arrives every year.","جاوااسکریپت از استاندارد ECMAScript پیروی می‌کند. ES5 (۲۰۰۹) مدت‌ها پایه بود، ES6/ES2015 مواردی مثل let، const، کلاس و تابع فلشی آورد و هر سال نسخه‌ای جدید می‌آید.",'console.log("Arrow functions:", typeof (() => 1) === "function");\nconsole.log("Optional chaining:", ({ a: { b: 1 } }).a?.b);\nconsole.log("Array.at:", [1, 2, 3].at(-1));\nconsole.log("structuredClone:", typeof structuredClone);');
J("JS HTML First","اول HTML","HTML first: build the page so it works with plain HTML and CSS, then use JavaScript to enhance it. Pages stay faster, more accessible and more robust.","اول HTML: صفحه را طوری بساز که با HTML و CSS ساده هم کار کند، بعد با جاوااسکریپت بهترش کن. صفحه سریع‌تر، دسترس‌پذیرتر و مقاوم‌تر می‌شود.",'document.body.innerHTML = "<details><summary>Works without JS</summary>Native HTML already does this.</details><p id=p>Plain text</p>";\ndocument.getElementById("p").textContent += " (enhanced by JavaScript)";');
J("JS Window API","API پنجره (Window)","window is the global object in a browser. It exposes innerWidth, location, history, navigator, screen and alert/confirm/prompt.","window آبجکت سراسری مرورگر است و شامل innerWidth، location، history، navigator، screen و alert/confirm/prompt است.",'console.log("Width:", window.innerWidth);\nconsole.log("Language:", navigator.language);\nconsole.log("Screen:", screen.width + "x" + screen.height);\nconsole.log("Online:", navigator.onLine);');
J("JS JSON","JSON","JSON is a text format for data. JSON.stringify turns an object into a string; JSON.parse turns a string back into an object. Keys need double quotes.","JSON یک قالب متنی برای داده است. JSON.stringify آبجکت را به رشته و JSON.parse رشته را دوباره به آبجکت تبدیل می‌کند. کلیدها گیومهٔ دوتایی می‌خواهند.",'const user = { name: "Sara", skills: ["HTML", "JS"] };\nconst text = JSON.stringify(user);\nconsole.log(text);\nconsole.log(JSON.parse(text).skills[1]);\nconsole.log(JSON.stringify(user, null, 2));');
J("JS Web API","وب API","Web APIs extend JavaScript with browser powers: DOM, fetch, storage, canvas, geolocation, notifications, clipboard and many more. Check support before using one.","وب API ها جاوااسکریپت را با قدرت مرورگر گسترش می‌دهند: DOM، fetch، ذخیره‌سازی، canvas، موقعیت، اعلان‌ها، کلیپ‌بورد و بیشتر. قبل از استفاده پشتیبانی را بررسی کن.",'const apis = ["fetch", "localStorage", "Notification", "IntersectionObserver", "ResizeObserver"];\napis.forEach(a => console.log(a, a in window));\nconsole.log("clipboard", "clipboard" in navigator);');
J("JS Temporal","Temporal","Temporal is the modern replacement for Date, with clear types for dates, times and time zones. It is new, so check support and fall back to Date.","Temporal جایگزین مدرن Date است با انواع شفاف برای تاریخ، زمان و منطقهٔ زمانی. تازه است، پس پشتیبانی را چک کن و به Date برگرد.",'if (typeof Temporal !== "undefined") {\n  console.log("Today:", Temporal.Now.plainDateISO().toString());\n} else {\n  console.log("Temporal is not supported here, falling back to Date");\n  console.log(new Date().toISOString().slice(0, 10));\n}');
J("JS Advanced Functions","توابع پیشرفته","Higher-order functions take or return functions. Also learn default parameters, rest (...args), spread, and currying.","توابع مرتبه‌بالا تابع می‌گیرند یا برمی‌گردانند. همچنین پارامتر پیش‌فرض، rest (...args)، spread و currying را یاد بگیر.",'const sum = (...n) => n.reduce((a, b) => a + b, 0);\nconsole.log(sum(1, 2, 3, 4));\nconst greet = (name = "friend") => `Hi ${name}`;\nconsole.log(greet(), greet("Sara"));\nconst add = a => b => a + b;\nconsole.log(add(2)(3));');
J("JS Advanced Objects","آبجکت‌های پیشرفته","Destructuring pulls values out of objects, spread copies and merges them, getters compute values, and Object.freeze makes an object read-only.","دیساکچرینگ مقدارها را از آبجکت بیرون می‌کشد، spread کپی و ادغام می‌کند، getter مقدار محاسبه می‌کند و Object.freeze آبجکت را فقط‌خواندنی می‌کند.",'const p = { first: "Sara", last: "Ahmadi", age: 24 };\nconst { first, ...rest } = p;\nconsole.log(first, rest);\nconst copy = { ...p, age: 25 };\nconsole.log(copy);\nconst o = { a: 1, get double() { return this.a * 2; } };\nconsole.log(o.double);');
J("JS Classes","کلاس‌ها","A class is a template for objects, with a constructor and methods. Use extends for inheritance, super to call the parent, and # for private fields.","کلاس قالبی برای آبجکت‌هاست با constructor و متد. برای وراثت از extends، برای صدا زدن والد از super و برای فیلد خصوصی از # استفاده کن.",'class Animal {\n  #secret = 42;\n  constructor(name) { this.name = name; }\n  speak() { return this.name + " makes a sound"; }\n  get secret() { return this.#secret; }\n}\nclass Dog extends Animal {\n  speak() { return super.speak() + ": Woof!"; }\n}\nconst d = new Dog("Rex");\nconsole.log(d.speak(), d.secret);');
J("JS Asynchronous","ناهمزمانی","Asynchronous code lets the page keep working while it waits. Callbacks came first, then Promises, and now async/await makes it read like normal code.","کد ناهمزمان اجازه می‌دهد صفحه هنگام منتظر ماندن کار کند. اول callback، بعد Promise و حالا async/await کد را مثل کد معمولی خوانا می‌کند.",'const wait = ms => new Promise(r => setTimeout(r, ms));\nasync function run() {\n  console.log("Start");\n  await wait(800);\n  console.log("After 0.8s");\n  const [a, b] = await Promise.all([wait(300).then(() => "A"), wait(500).then(() => "B")]);\n  console.log(a, b);\n}\nrun();');
J("JS Modules","ماژول‌ها","Modules split code into files. Use export to share and import to use: script type=\"module\" enables them. Each module has its own scope.","ماژول‌ها کد را بین فایل‌ها تقسیم می‌کنند. با export اشتراک و با import استفاده کن: script type=\"module\" آن‌ها را فعال می‌کند. هر ماژول دامنهٔ خودش را دارد.",'// math.js:  export const double = n => n * 2;\n// main.js:  import { double } from "./math.js";\nconst src = "export const double = n => n * 2;";\nconst url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));\nimport(url).then(m => console.log(m.double(21))).catch(e => console.log("Dynamic import blocked here:", e.message));');
J("JS Meta & Proxy","متا و پراکسی","A Proxy wraps an object and intercepts operations such as get and set. Reflect offers the default behavior. Useful for validation and logging.","Proxy یک آبجکت را می‌پیچد و عملیاتی مثل get و set را شنود می‌کند. Reflect رفتار پیش‌فرض را می‌دهد. برای اعتبارسنجی و لاگ مفید است.",'const user = new Proxy({}, {\n  set(t, k, v) {\n    if (k === "age" && typeof v !== "number") throw new TypeError("age must be a number");\n    console.log("set", k, v);\n    return Reflect.set(t, k, v);\n  }\n});\nuser.age = 24;\ntry { user.age = "old"; } catch (e) { console.log(e.message); }');
J("JS Typed Arrays","آرایه‌های تایپ‌د","Typed arrays (Uint8Array, Float32Array, Int16Array…) store raw numbers of one type in a fixed-size buffer. They are fast and used for audio, graphics and files.","آرایه‌های تایپ‌د (Uint8Array، Float32Array، Int16Array…) اعداد خام یک نوع را در بافر با اندازهٔ ثابت نگه می‌دارند. سریعند و برای صدا، گرافیک و فایل به کار می‌روند.",'const a = new Uint8Array(4);\na[0] = 255; a[1] = 256; a[2] = -1;\nconsole.log(a);\nconst f = new Float32Array([1.5, 2.5]);\nconsole.log(f.length, f.byteLength);\nconsole.log(new TextEncoder().encode("Hi"));');
J("JS DOM Navigation","پیمایش DOM","Move through the DOM tree with parentElement, children, firstElementChild, nextElementSibling and closest().","در درخت DOM با parentElement، children، firstElementChild، nextElementSibling و closest() حرکت کن.",'document.body.innerHTML = "<ul id=u><li>One</li><li id=two>Two</li><li>Three</li></ul>";\nconst two = document.getElementById("two");\nconsole.log(two.previousElementSibling.textContent);\nconsole.log(two.nextElementSibling.textContent);\nconsole.log(two.parentElement.id, two.parentElement.children.length);\nconsole.log(two.closest("ul").tagName);');
J("JS Graphics","گرافیک","Draw with the canvas element and its 2D context: fillRect, arc, lineTo, fillText. Use requestAnimationFrame for animation.","با المان canvas و context دوبعدی بکش: fillRect، arc، lineTo و fillText. برای انیمیشن از requestAnimationFrame استفاده کن.",'document.body.innerHTML = "<canvas id=c width=300 height=120></canvas>";\nconst ctx = document.getElementById("c").getContext("2d");\nlet x = 0;\nfunction frame() {\n  ctx.clearRect(0, 0, 300, 120);\n  ctx.fillStyle = "#5b3df5";\n  ctx.beginPath(); ctx.arc(x, 60, 20, 0, 7); ctx.fill();\n  x = (x + 2) % 320;\n  requestAnimationFrame(frame);\n}\nframe();');
J("JS AJAX","AJAX","AJAX means updating part of a page with data from the server without reloading. The classic tool is XMLHttpRequest; today use fetch.","AJAX یعنی به‌روزرسانی بخشی از صفحه با دادهٔ سرور بدون بارگذاری مجدد. ابزار قدیمی XMLHttpRequest بود؛ امروز از fetch استفاده کن.",'const xhr = new XMLHttpRequest();\nxhr.open("GET", "https://jsonplaceholder.typicode.com/todos/1");\nxhr.onload = () => console.log(xhr.status, xhr.responseText.slice(0, 60));\nxhr.onerror = () => console.log("Network error (blocked in this sandbox?)");\nxhr.send();');
J("JS jQuery","jQuery","jQuery is an older library that shortened DOM code. Modern JavaScript can do the same with querySelectorAll, classList and fetch, so new projects rarely need it.","jQuery کتابخانهٔ قدیمی‌تری برای کوتاه‌کردن کد DOM بود. جاوااسکریپت مدرن همین کار را با querySelectorAll، classList و fetch می‌کند، پس پروژه‌های تازه کمتر به آن نیاز دارند.",'// jQuery:  $(".item").addClass("hot").hide();\ndocument.body.innerHTML = "<p class=item>One</p><p class=item>Two</p>";\ndocument.querySelectorAll(".item").forEach(el => {\n  el.classList.add("hot");\n  el.style.color = "tomato";\n});\nconsole.log(document.querySelectorAll(".hot").length + " items styled");');
J("JS JSONP","JSONP","JSONP loaded data across sites by adding a script tag that calls a function. It is obsolete and unsafe; use CORS with fetch instead.","JSONP با اضافه کردن تگ script که یک تابع را صدا می‌زد، داده را بین سایت‌ها می‌گرفت. منسوخ و ناامن است؛ به‌جایش از CORS و fetch استفاده کن.",'// The server wraps data in a call: handle({"name":"Sara"})\nfunction handle(data) { console.log("JSONP received:", data.name); }\nhandle({ name: "Sara" });\nconsole.log("Prefer: fetch(url) with CORS enabled on the server");');
J("JS Examples","مثال‌های جاوااسکریپت","A mixed example: build a list from an array, filter it, and show a total. Change the data and run again.","یک مثال ترکیبی: از یک آرایه لیست بساز، فیلترش کن و جمع کل را نشان بده. داده را عوض کن و دوباره اجرا کن.",'const items = [\n  { name: "Book", price: 12 },\n  { name: "Pen", price: 2 },\n  { name: "Laptop", price: 900 }\n];\nconst cheap = items.filter(i => i.price < 100);\nconsole.log(cheap.map(i => i.name).join(", "));\nconsole.log("Total:", cheap.reduce((s, i) => s + i.price, 0));');
Object.assign(UI.en,{credit:"Developed by the Frontino team"});Object.assign(UI.fa,{credit:"توسعه‌یافته توسط تیم فرانتینو"});
const QR={en:[["Which hook stores a value that changes over time?",["useState","useFetch","useStyle"],0],["What must a component name start with?",["A lowercase letter","A capital letter","An underscore"],1],["What does each list item need when rendered with map()?",["A unique key","A class name","Nothing"],0]],fa:[["کدام هوک مقداری را که با زمان تغییر می‌کند نگه می‌دارد؟",["useState","useFetch","useStyle"],0],["نام کامپوننت باید با چه چیزی شروع شود؟",["حرف کوچک","حرف بزرگ","آندرلاین"],1],["وقتی لیست را با map() رندر می‌کنیم، هر آیتم به چه چیزی نیاز دارد؟",["یک key یکتا","یک نام کلاس","هیچ‌چیز"],0]]};
const R=(k,ft,en,fa,c)=>{A("react",k,[en],c,[fa]);FAT[k]=ft};
R("React Home","خانهٔ ری‌اکت","Welcome! React builds interfaces from components. Every example runs live: edit the code, press Run and watch the result.","خوش آمدی! ری‌اکت رابط کاربری را از کامپوننت‌ها می‌سازد. همهٔ مثال‌ها زنده اجرا می‌شوند: کد را عوض کن، Run بزن و نتیجه را ببین.",'function App() { return <h2>Hello React!</h2>; }\nReactDOM.createRoot(root).render(<App />);');
R("React Get Started","شروع کار","For real projects use Vite: npm create vite@latest my-app -- --template react, then npm install and npm run dev. You need Node.js installed.","برای پروژه‌های واقعی از Vite استفاده کن: npm create vite@latest my-app -- --template react و سپس npm install و npm run dev. Node.js لازم است.",'function App() {\n  const steps = ["npm create vite@latest my-app -- --template react", "cd my-app", "npm install", "npm run dev"];\n  return <ol>{steps.map(s => <li key={s}><code>{s}</code></li>)}</ol>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React First App","اولین اپ","Your first app is just a component rendered into a root element. Combine a few components to build a page.","اولین اپ فقط یک کامپوننت است که در یک المان ریشه رندر می‌شود. چند کامپوننت را ترکیب کن تا یک صفحه بسازی.",'const Header = () => <h1>My First App</h1>;\nconst Footer = () => <small>Built with React</small>;\nfunction App() {\n  return <div><Header /><p>Hello from my first app.</p><Footer /></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Render HTML","رندر HTML","createRoot(container).render(element) draws React content inside a DOM element. React then updates only what changed.","createRoot(container).render(element) محتوای ری‌اکت را داخل یک المان DOM می‌کشد و بعد فقط چیزی را که عوض شده به‌روز می‌کند.",'const element = <h2 style={{ color: "tomato" }}>Rendered into #root</h2>;\nReactDOM.createRoot(root).render(element);');
R("React Upgrade","ارتقای ری‌اکت","React 18 replaced ReactDOM.render with createRoot and added automatic batching. Upgrade by installing the new react and react-dom, then switching to createRoot.","ری‌اکت ۱۸ به‌جای ReactDOM.render از createRoot استفاده می‌کند و دسته‌بندی خودکار آورد. برای ارتقا react و react-dom جدید را نصب کن و به createRoot تغییر بده.",'function App() {\n  return <pre>{"// Before (React 17)\\nReactDOM.render(<App />, el);\\n\\n// After (React 18+)\\nReactDOM.createRoot(el).render(<App />);"}</pre>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React ES6","ES6 برای ری‌اکت","React code relies on ES6: arrow functions, const/let, destructuring, spread, template literals, and array methods like map and filter.","کد ری‌اکت به ES6 تکیه دارد: تابع فلشی، const/let، دیساکچرینگ، spread، رشته‌های قالبی و متدهای آرایه مثل map و filter.",'const user = { name: "Sara", skills: ["HTML", "React"] };\nconst { name, skills } = user;\nconst all = [...skills, "JS"];\nfunction App() {\n  return <div><h3>{`Hi ${name}`}</h3><p>{all.map(s => s.toUpperCase()).join(" | ")}</p></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React JSX Intro","مقدمه JSX","JSX looks like HTML inside JavaScript. A tool called Babel turns it into React.createElement calls. A component returns one root element.","JSX شبیه HTML درون جاوااسکریپت است. ابزاری به نام Babel آن را به فراخوانی ‌React.createElement تبدیل می‌کند. کامپوننت یک المان ریشه برمی‌گرداند.",'function App() {\n  return (\n    <>\n      <h2>JSX needs one root</h2>\n      <p>A fragment wraps siblings without extra HTML.</p>\n    </>\n  );\n}\nReactDOM.createRoot(root).render(<App />);');
R("React JSX Expressions","عبارت‌های JSX","Put any JavaScript expression inside curly braces {}: variables, math, function calls and ternaries.","هر عبارت جاوااسکریپتی را داخل آکولاد {} بگذار: متغیر، محاسبه، فراخوانی تابع و عملگر سه‌تایی.",'function App() {\n  const price = 20, qty = 3;\n  const fmt = n => n.toFixed(2);\n  return <p>Total: {fmt(price * qty)} USD ({qty > 2 ? "bulk" : "single"})</p>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React JSX Attributes","ویژگی‌های JSX","JSX attributes use camelCase: className instead of class, htmlFor instead of for, and style takes an object.","ویژگی‌های JSX با camelCase نوشته می‌شوند: className به‌جای class، htmlFor به‌جای for و style یک آبجکت می‌گیرد.",'function App() {\n  return (\n    <div>\n      <style>{".big{font-size:24px}"}</style>\n      <label htmlFor="n">Name </label>\n      <input id="n" className="big" style={{ border: "2px solid #5b3df5" }} />\n    </div>\n  );\n}\nReactDOM.createRoot(root).render(<App />);');
R("React JSX If Statements","شرط‌ها در JSX","You cannot write if inside JSX, but you can use it before return, or use the ternary and && operators inside.","داخل JSX نمی‌شود if نوشت، ولی می‌شود قبل از return استفاده کرد یا از عملگر سه‌تایی و && داخل آن.",'function Greeting({ hour }) {\n  if (hour < 12) return <p>Good morning</p>;\n  return <p>Good day {hour > 20 && "(late!)"}</p>;\n}\nfunction App() { return <><Greeting hour={9} /><Greeting hour={21} /></>; }\nReactDOM.createRoot(root).render(<App />);');
R("React Class","کامپوننت کلاسی","Class components extend React.Component and define render(). They are the older style; new code uses function components with hooks.","کامپوننت کلاسی از React.Component ارث‌بری می‌کند و render() دارد. سبک قدیمی است؛ کد جدید از کامپوننت تابعی با هوک استفاده می‌کند.",'class Counter extends React.Component {\n  state = { n: 0 };\n  render() {\n    return <button onClick={() => this.setState({ n: this.state.n + 1 })}>Count: {this.state.n}</button>;\n  }\n}\nReactDOM.createRoot(root).render(<Counter />);');
R("React Props Destructuring","دیساکچرینگ پراپس","Destructure props in the parameter list, with default values, to keep components short and readable.","پراپس را در لیست پارامتر دیساکچر کن و مقدار پیش‌فرض بده تا کامپوننت کوتاه و خوانا بماند.",'function Badge({ label, color = "#5b3df5" }) {\n  return <span style={{ background: color, color: "#fff", padding: "4px 10px", borderRadius: 8, margin: 4 }}>{label}</span>;\n}\nfunction App() { return <><Badge label="React" /><Badge label="JS" color="#c98a00" /></>; }\nReactDOM.createRoot(root).render(<App />);');
R("React Props Children","children در پراپس","Whatever you put between a component tags arrives as props.children. It makes wrapper components like cards and layouts.","هر چیزی بین تگ‌های کامپوننت بگذاری به شکل props.children می‌رسد. با آن کامپوننت‌های ظرفی مثل کارت و چیدمان می‌سازیم.",'function Card({ title, children }) {\n  return <div style={{ border: "2px solid #5b3df5", padding: 14, borderRadius: 12 }}><h3>{title}</h3>{children}</div>;\n}\nfunction App() { return <Card title="Card"><p>Any content goes here.</p><button>OK</button></Card>; }\nReactDOM.createRoot(root).render(<App />);');
R("React Forms Submit","ارسال فرم","Handle onSubmit on the form, call event.preventDefault() to stop the page reload, then use your state.","onSubmit را روی فرم مدیریت کن، event.preventDefault() را بزن تا صفحه ریلود نشود و بعد از state استفاده کن.",'function App() {\n  const [name, setName] = React.useState("");\n  const [sent, setSent] = React.useState("");\n  return (\n    <form onSubmit={e => { e.preventDefault(); setSent(name); }}>\n      <input value={name} onChange={e => setName(e.target.value)} placeholder="Name" />\n      <button>Send</button>\n      {sent && <p>Submitted: {sent}</p>}\n    </form>\n  );\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Textarea","متن چندخطی","In React a textarea uses a value prop and onChange, just like an input, not text between its tags.","در ری‌اکت textarea مثل input از پراپ value و onChange استفاده می‌کند، نه متن بین تگ‌ها.",'function App() {\n  const [t, setT] = React.useState("Write here");\n  return <div><textarea value={t} onChange={e => setT(e.target.value)} rows={3} /><p>{t.length} characters</p></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Select","لیست کشویی","For a select, set value and onChange on the select element itself, not selected on each option.","برای select، value و onChange را روی خود select بگذار، نه selected روی هر option.",'function App() {\n  const [c, setC] = React.useState("react");\n  return <div><select value={c} onChange={e => setC(e.target.value)}><option value="html">HTML</option><option value="css">CSS</option><option value="react">React</option></select><p>Chosen: {c}</p></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Multiple Inputs","چند ورودی","Keep several inputs in one state object and update by the input name: setForm({ ...form, [e.target.name]: e.target.value }).","چند ورودی را در یک آبجکت state نگه دار و با نام ورودی به‌روز کن: setForm({ ...form, [e.target.name]: e.target.value }).",'function App() {\n  const [f, setF] = React.useState({ first: "", last: "" });\n  const on = e => setF({ ...f, [e.target.name]: e.target.value });\n  return <div><input name="first" value={f.first} onChange={on} placeholder="First" /><input name="last" value={f.last} onChange={on} placeholder="Last" /><p>{f.first} {f.last}</p></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Checkbox","چک‌باکس","A checkbox uses the checked prop (a boolean) and onChange reads e.target.checked.","چک‌باکس از پراپ checked (بولی) استفاده می‌کند و onChange مقدار e.target.checked را می‌خواند.",'function App() {\n  const [ok, setOk] = React.useState(false);\n  return <label><input type="checkbox" checked={ok} onChange={e => setOk(e.target.checked)} /> I agree {ok ? "✔" : ""}</label>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Radio","رادیو","Radios share a name; checked is true when the state equals that option value.","رادیوها یک name مشترک دارند؛ checked وقتی درست است که state برابر مقدار آن گزینه باشد.",'function App() {\n  const [v, setV] = React.useState("b");\n  return <div>{["a", "b", "c"].map(o => <label key={o} style={{ marginRight: 12 }}><input type="radio" name="g" value={o} checked={v === o} onChange={() => setV(o)} /> {o}</label>)}<p>Selected: {v}</p></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Portals","پورتال‌ها","A portal renders children into a different DOM node, such as document.body. It is ideal for modals and tooltips that must escape overflow or z-index.","پورتال فرزندان را در یک نود دیگر DOM مثل document.body رندر می‌کند. برای مودال و تولتیپ که باید از overflow و z-index بیرون بیایند عالی است.",'function Modal({ children }) {\n  return ReactDOM.createPortal(<div style={{ position: "fixed", inset: "30% 20% auto", background: "#fff", border: "2px solid #5b3df5", padding: 16 }}>{children}</div>, document.body);\n}\nfunction App() {\n  const [o, setO] = React.useState(false);\n  return <div><button onClick={() => setO(!o)}>Toggle modal</button>{o && <Modal>Rendered in body</Modal>}</div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Suspense","ساسپنس","Suspense shows a fallback while a lazy component or data is loading. React.lazy loads a component only when it is first needed.","Suspense تا آماده شدن یک کامپوننت تنبل یا داده، یک fallback نشان می‌دهد. React.lazy کامپوننت را فقط وقتی اولین‌بار لازم شد بارگذاری می‌کند.",'const Slow = React.lazy(() => new Promise(r => setTimeout(() => r({ default: () => <h3>Loaded!</h3> }), 1500)));\nfunction App() {\n  return <React.Suspense fallback={<p>Loading…</p>}><Slow /></React.Suspense>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React CSS Styling","استایل‌دهی با CSS","Style React with inline style objects (camelCase keys) or with className and a normal stylesheet.","ری‌اکت را با آبجکت استایل درون‌خطی (کلیدهای camelCase) یا با className و فایل CSS معمولی استایل کن.",'function App() {\n  const box = { backgroundColor: "#5b3df5", color: "white", padding: 16, borderRadius: 12 };\n  return <div><style>{".tag{color:tomato;font-weight:bold}"}</style><div style={box}>Inline style</div><p className="tag">className style</p></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React CSS Modules","ماژول‌های CSS","A file named Button.module.css is imported as an object: className={styles.btn}. The build tool makes class names unique so styles never clash.","فایل Button.module.css به شکل آبجکت import می‌شود: className={styles.btn}. ابزار بیلد نام کلاس‌ها را یکتا می‌کند تا استایل‌ها تداخل نداشته باشند.",'// Button.module.css  ->  .btn { background: #5b3df5; color: white; }\n// import styles from "./Button.module.css";\nconst styles = { btn: "btn_x7f3a" };  // what the build tool generates\nfunction App() {\n  return <div><style>{".btn_x7f3a{background:#5b3df5;color:#fff;padding:10px 18px;border:0;border-radius:8px}"}</style><button className={styles.btn}>Scoped button</button></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React CSS-in-JS","CSS در جاوااسکریپت","CSS-in-JS writes styles next to the component, often with libraries like styled-components or Emotion. You can imitate the idea with style functions.","CSS-in-JS استایل را کنار کامپوننت می‌نویسد، معمولاً با کتابخانه‌هایی مثل styled-components یا Emotion. ایده را با توابع استایل هم می‌توان شبیه‌سازی کرد.",'const btn = primary => ({ padding: "10px 18px", border: 0, borderRadius: 8, color: "#fff", background: primary ? "#5b3df5" : "#777" });\nfunction App() {\n  return <div><button style={btn(true)}>Primary</button> <button style={btn(false)}>Secondary</button></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Router","روتر ری‌اکت","React Router maps URLs to components: npm install react-router-dom, then use BrowserRouter, Routes, Route and Link. Here is the same idea with a tiny hash router.","روتر ری‌اکت آدرس‌ها را به کامپوننت وصل می‌کند: npm install react-router-dom و بعد BrowserRouter، Routes، Route و Link. اینجا همان ایده با یک روتر هش کوچک نشان داده شده.",'function App() {\n  const [page, setPage] = React.useState("home");\n  const pages = { home: <h3>Home</h3>, about: <h3>About</h3>, contact: <h3>Contact</h3> };\n  return <div>{Object.keys(pages).map(p => <button key={p} onClick={() => setPage(p)} style={{ marginRight: 6 }}>{p}</button>)}{pages[page]}</div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Transitions","ترنزیشن‌ها","useTransition marks a state update as non-urgent so typing and clicks stay responsive while heavy updates finish in the background.","useTransition یک به‌روزرسانی را غیرفوری علامت می‌زند تا تایپ و کلیک روان بماند و کار سنگین در پس‌زمینه تمام شود.",'function App() {\n  const [q, setQ] = React.useState("");\n  const [list, setList] = React.useState([]);\n  const [pending, start] = React.useTransition();\n  const on = e => { setQ(e.target.value); start(() => setList(Array.from({ length: 3000 }, (_, i) => e.target.value + i))); };\n  return <div><input value={q} onChange={on} placeholder="Type fast" />{pending && <p>Updating…</p>}<p>{list.length} items</p></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React Forward Ref","فوروارد رف","forwardRef lets a parent reach a DOM element inside a child component through a ref, for example to focus an input.","forwardRef به والد اجازه می‌دهد از طریق ref به یک المان DOM داخل فرزند برسد، مثلاً برای فوکوس روی یک input.",'const Field = React.forwardRef((props, ref) => <input ref={ref} {...props} />);\nfunction App() {\n  const r = React.useRef();\n  return <div><Field ref={r} placeholder="Child input" /><button onClick={() => r.current.focus()}>Focus it</button></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React HOC","کامپوننت مرتبه‌بالا","A higher-order component is a function that takes a component and returns a new one with extra behavior. Hooks often replace them today.","کامپوننت مرتبه‌بالا تابعی است که یک کامپوننت می‌گیرد و نسخه‌ای با رفتار اضافه برمی‌گرداند. امروز هوک‌ها معمولاً جایگزین آن می‌شوند.",'const withBorder = Comp => props => <div style={{ border: "2px dashed tomato", padding: 10 }}><Comp {...props} /></div>;\nconst Hello = ({ name }) => <p>Hello {name}</p>;\nconst BorderedHello = withBorder(Hello);\nReactDOM.createRoot(root).render(<BorderedHello name="Sara" />);');
R("React Sass","Sass در ری‌اکت","Install Sass with npm install sass, then import .scss files. Sass adds variables, nesting and mixins that compile to normal CSS.","Sass را با npm install sass نصب کن و فایل‌های scss را import کن. Sass متغیر، تودرتویی و mixin می‌آورد که به CSS معمولی کامپایل می‌شود.",'// styles.scss\n// $brand: #5b3df5;\n// .card { color: $brand; &:hover { color: tomato; } }\nfunction App() {\n  return <div><style>{".card{color:#5b3df5;font-weight:700;cursor:pointer}.card:hover{color:tomato}"}</style><p className="card">Compiled from Sass (hover me)</p></div>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("What is Hooks?","هوک چیست؟","Hooks are functions starting with use that let function components use state and other React features. Call them at the top level of a component, never inside loops or conditions.","هوک‌ها توابعی با پیشوند use هستند که به کامپوننت تابعی اجازهٔ استفاده از state و امکانات دیگر می‌دهند. آن‌ها را فقط در سطح بالای کامپوننت صدا بزن، نه در حلقه یا شرط.",'function App() {\n  const [n, setN] = React.useState(0);\n  React.useEffect(() => { document.title = "Clicks: " + n; });\n  return <button onClick={() => setN(n + 1)}>Hooks: useState + useEffect ({n})</button>;\n}\nReactDOM.createRoot(root).render(<App />);');
R("React useContext","useContext","Context shares a value with every component below a Provider, without passing props through each level. Create it with createContext and read it with useContext.","Context یک مقدار را بین همهٔ کامپوننت‌های زیر Provider بدون عبور پراپس از هر سطح اشتراک می‌گذارد. با createContext بساز و با useContext بخوان.",'const Theme = React.createContext("light");\nfunction Label() {\n  const t = React.useContext(Theme);\n  return <p style={{ background: t === "dark" ? "#222" : "#eee", color: t === "dark" ? "#fff" : "#000", padding: 10 }}>Theme: {t}</p>;\n}\nfunction App() { return <Theme.Provider value="dark"><div><Label /></div></Theme.Provider>; }\nReactDOM.createRoot(root).render(<App />);');
